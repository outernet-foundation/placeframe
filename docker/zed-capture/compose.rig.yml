services:
  zed-capture:
    image: ${ZED_IMAGE:-ghcr.io/outernet-foundation/placeframe/zed-capture:${ZED_CAPTURE_SHA:?err}}
    network_mode: host
    privileged: true
    runtime: nvidia
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - captures:/root/captures
      - zed-logs:/var/log/zed-capture
      - zed-state:/var/lib/zed-capture
      - /usr/local/zed/settings:/usr/local/zed/settings
      - /usr/local/zed/resources:/usr/local/zed/resources
      - /tmp/argus_socket:/tmp/argus_socket
      - /tmp/nvscsock:/tmp/nvscsock
      - /tmp/camsock:/tmp/camsock
    environment:
      ZED_BOX_ID: ${ZED_BOX_ID:?err}
      DEPLOYMENT_ENVIRONMENT: production
      SERVICE_VERSION: ${ZED_CAPTURE_SHA:?err}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4317
    # "no" so dockerd never starts a container on its own. Any policy other than
    # "no" makes dockerd restart a was-running container on daemon startup (after
    # an unclean power-cut the container object survives in running state), which
    # happens during daemon init — before and independent of systemd ordering, so
    # it bypasses placeframe-zed.service's readiness gate entirely. "no" makes the
    # gated unit the sole starter: nothing comes up until the camera is ready.
    restart: "no"

  # Caddy sidecar terminating h2c (HTTP/2 cleartext, prior-knowledge) on 9000
  # and reverse-proxying HTTP/1.1 to uvicorn on 127.0.0.1:9001. Required so the
  # phone-side AOA client can multiplex concurrent requests over the single
  # accessory FD; uvicorn itself doesn't speak HTTP/2.
  aoa-gateway:
    image: ${AOA_GATEWAY_IMAGE:-ghcr.io/outernet-foundation/placeframe/aoa-gateway:${AOA_GATEWAY_SHA:?err}}
    network_mode: host
    environment:
      # Go HTTP/2 frame-level trace. Logs every SETTINGS/HEADERS/RST_STREAM/GOAWAY
      # frame sent or received on stderr; aoa-alloy receives OTLP from the host
      # network namespace and forwards to local box-Loki.
      GODEBUG: http2debug=2
    restart: "no"

  # privileged + bind-mounted /dev/bus/usb for pyusb. network_mode: host so
  # 127.0.0.1 resolves to aoa-gateway's bound port. The bind mount uses
  # rslave propagation so the AOA handshake's phone re-enumeration (pid flips
  # from MTP/PTP to a 0x2D0x accessory pid) is visible inside the container;
  # `devices:` would have snapshot-mapped only the device nodes present at
  # container start and would miss everything that hot-plugs after.
  aoa-bridge:
    image: ${AOA_BRIDGE_IMAGE:-ghcr.io/outernet-foundation/placeframe/aoa-bridge:${AOA_BRIDGE_SHA:?err}}
    network_mode: host
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb:rslave
      - zed-logs:/var/log/zed-capture
    restart: "no"

  # Box-side Loki: monolithic mode, filesystem storage, 72h retention. Buffer
  # between aoa-alloy (writes) and the phone-relay (reads through box-Caddy's
  # /loki/* handle). Bound to 127.0.0.1:3100 so the wired ethernet doesn't
  # expose the HTTP API. Reuses the placeframe-owned Loki wrapper image; the
  # box-specific config is baked at /etc/loki/box.yaml alongside the main
  # stack's /etc/loki/config.yaml — command picks the right one.
  aoa-loki:
    image: ${LOKI_IMAGE:-ghcr.io/outernet-foundation/placeframe/loki:${LOKI_SHA:?err}}
    network_mode: host
    volumes:
      - aoa-loki:/loki
    command: -config.file=/etc/loki/box.yaml
    restart: "no"

  # Box-side Alloy: receives OTLP from zed-capture and aoa-gateway, forwards
  # to aoa-loki. Reuses the placeframe-owned Alloy wrapper image — the config
  # baked at /etc/alloy/config.alloy is identical to the main stack's;
  # LOKI_OTLP_ENDPOINT drives the only per-stack difference.
  aoa-alloy:
    image: ${ALLOY_IMAGE:-ghcr.io/outernet-foundation/placeframe/alloy:${ALLOY_SHA:?err}}
    network_mode: host
    environment:
      LOKI_OTLP_ENDPOINT: http://127.0.0.1:3100/otlp
    command: run /etc/alloy/config.alloy --server.http.listen-addr=127.0.0.1:12345
    restart: "no"

volumes:
  captures:
  zed-logs:
  zed-state:
  aoa-loki:
