[project]
name = "s3-initializer"
version = "0.1.0"
description = "Converges the stack's required S3 buckets on the SeaweedFS endpoint at bring-up"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.39.5",
    "botocore>=1.42.24",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.10.1",
]

[dependency-groups]
dev = ["boto3-stubs[s3]>=1.40.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s3_initializer"]

[project.scripts]
s3-initializer = "s3_initializer.main:main"
