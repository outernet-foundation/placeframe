# x-base-images is the single declaration home for every third-party image this
# repo consumes — Dockerfile bases AND runtime images pulled by compose (the
# `*_IMAGE` keys feed compose image holes via images.lock).
x-base-images:
  UV_BASE_IMAGE: "ghcr.io/astral-sh/uv:0.12.15-python3.13-trixie-slim"
  GOLANG_IMAGE: "docker.io/library/golang:1.22-alpine"
  ALPINE_IMAGE: "docker.io/library/alpine:3.20"
  CADDY_IMAGE: "docker.io/library/caddy:2.8.4-alpine"
  POSTGRES_BOOKWORM_IMAGE: "docker.io/library/postgres:16-bookworm"
  LOKI_IMAGE: "docker.io/grafana/loki:3.5.0"
  ALLOY_IMAGE: "docker.io/grafana/alloy:v1.9.0"
  GRAFANA_IMAGE: "docker.io/grafana/grafana:11.6.0"
  POSTGIS_IMAGE: "docker.io/postgis/postgis:16-3.4-alpine"
  SEAWEEDFS_IMAGE: "docker.io/chrislusf/seaweedfs:4.47"
  KEYCLOAK_IMAGE: "quay.io/keycloak/keycloak:26.8.1"
  KEYCLOAK_OPERATOR_IMAGE: "quay.io/keycloak/keycloak-operator:26.8.1"
  NGROK_IMAGE: "docker.io/ngrok/ngrok:alpine"
  SEAWEEDFS_AUDIT_IMAGE: "docker.io/fluent/fluent-bit:5.1.2"
  INITIALIZE_S3_IMAGE: "docker.io/amazon/aws-cli:2.36.9"

x-base-args: &base-args
  UV_BASE_IMAGE: "${UV_BASE_IMAGE:-}"
  GOLANG_IMAGE: "${GOLANG_IMAGE:-}"
  ALPINE_IMAGE: "${ALPINE_IMAGE:-}"
  CADDY_IMAGE: "${CADDY_IMAGE:-}"
  POSTGRES_BOOKWORM_IMAGE: "${POSTGRES_BOOKWORM_IMAGE:-}"
  LOKI_IMAGE: "${LOKI_IMAGE:-}"
  ALLOY_IMAGE: "${ALLOY_IMAGE:-}"
  GRAFANA_IMAGE: "${GRAFANA_IMAGE:-}"
  POSTGIS_IMAGE: "${POSTGIS_IMAGE:-}"
  SEAWEEDFS_IMAGE: "${SEAWEEDFS_IMAGE:-}"

x-registry-cache: ghcr.io/outernet-foundation/placeframe/build-cache

services:
  s3-initializer:
    build:
      dockerfile: workloads/s3-initializer/Dockerfile
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/s3-initializer:latest"
        - "ghcr.io/outernet-foundation/placeframe/s3-initializer:${S3_INITIALIZER_SHA}"

  create-database:
    build:
      dockerfile: workloads/database-manager/Dockerfile
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/database-manager:latest"
        - "ghcr.io/outernet-foundation/placeframe/database-manager:${DATABASE_MANAGER_SHA}"

  auth-initializer:
    build:
      dockerfile: workloads/auth-initializer/Dockerfile
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/auth-initializer:latest"
        - "ghcr.io/outernet-foundation/placeframe/auth-initializer:${AUTH_INITIALIZER_SHA}"

  gateway:
    build:
      dockerfile: workloads/gateway/Dockerfile
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/gateway:latest"
        - "ghcr.io/outernet-foundation/placeframe/gateway:${GATEWAY_SHA}"

  database-migrator:
    build:
      dockerfile: workloads/database-migrator/Dockerfile
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/database-migrator:latest"
        - "ghcr.io/outernet-foundation/placeframe/database-migrator:${DATABASE_MIGRATOR_SHA}"

  api:
    build:
      dockerfile: workloads/api/Dockerfile
      target: dev
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/api:latest"
        - "ghcr.io/outernet-foundation/placeframe/api:${API_SHA}"

  lease-server:
    build:
      dockerfile: workloads/lease-server/Dockerfile
      target: dev
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/lease-server:latest"
        - "ghcr.io/outernet-foundation/placeframe/lease-server:${LEASE_SERVER_SHA}"

  postgres:
    build:
      dockerfile: workloads/postgres/Dockerfile
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/postgres:latest"
        - "ghcr.io/outernet-foundation/placeframe/postgres:${POSTGRES_SHA}"

  seaweedfs:
    build:
      dockerfile: workloads/seaweedfs/Dockerfile
      args: *base-args
      tags:
        - "ghcr.io/outernet-foundation/placeframe/seaweedfs:latest"
        - "ghcr.io/outernet-foundation/placeframe/seaweedfs:${SEAWEEDFS_SHA}"

  neural-networks-base-cuda:
    x-gpu: cuda
    build:
      dockerfile: workloads/neural-networks-base/Dockerfile
      args:
        <<: *base-args
        TORCH_DEVICE: "cuda"
      tags:
        - "ghcr.io/outernet-foundation/placeframe/neural-networks-base-cuda:latest"
        - "ghcr.io/outernet-foundation/placeframe/neural-networks-base-cuda:${NEURAL_NETWORKS_BASE_SHA}"

  neural-networks-base-rocm:
    x-gpu: rocm
    build:
      dockerfile: workloads/neural-networks-base/Dockerfile
      args:
        <<: *base-args
        TORCH_DEVICE: "rocm"
      tags:
        - "ghcr.io/outernet-foundation/placeframe/neural-networks-base-rocm:latest"
        - "ghcr.io/outernet-foundation/placeframe/neural-networks-base-rocm:${NEURAL_NETWORKS_BASE_SHA}"

  reconstructor-cuda:
    x-gpu: cuda
    build:
      dockerfile: workloads/reconstructor/Dockerfile
      args:
        <<: *base-args
        TORCH_DEVICE: "cuda"
        RECONSTRUCTOR_SHA: "${RECONSTRUCTOR_SHA:?err}"
      tags:
        - "ghcr.io/outernet-foundation/placeframe/reconstructor-cuda:latest"
        - "ghcr.io/outernet-foundation/placeframe/reconstructor-cuda:${RECONSTRUCTOR_SHA}"
      additional_contexts:
        neural-networks-base: "target:neural-networks-base-cuda"

  localizer-cuda:
    x-gpu: cuda
    build:
      dockerfile: workloads/localizer/Dockerfile
      args:
        <<: *base-args
        TORCH_DEVICE: "cuda"
        LOCALIZER_SHA: "${LOCALIZER_SHA:?err}"
      tags:
        - "ghcr.io/outernet-foundation/placeframe/localizer-cuda:latest"
        - "ghcr.io/outernet-foundation/placeframe/localizer-cuda:${LOCALIZER_SHA}"
      additional_contexts:
        neural-networks-base: "target:neural-networks-base-cuda"

  reconstructor-rocm:
    x-gpu: rocm
    build:
      dockerfile: workloads/reconstructor/Dockerfile
      args:
        <<: *base-args
        TORCH_DEVICE: "rocm"
        RECONSTRUCTOR_SHA: "${RECONSTRUCTOR_SHA:?err}"
      tags:
        - "ghcr.io/outernet-foundation/placeframe/reconstructor-rocm:latest"
        - "ghcr.io/outernet-foundation/placeframe/reconstructor-rocm:${RECONSTRUCTOR_SHA}"
      additional_contexts:
        neural-networks-base: "target:neural-networks-base-rocm"

  localizer-rocm:
    x-gpu: rocm
    build:
      dockerfile: workloads/localizer/Dockerfile
      args:
        <<: *base-args
        TORCH_DEVICE: "rocm"
        LOCALIZER_SHA: "${LOCALIZER_SHA:?err}"
      tags:
        - "ghcr.io/outernet-foundation/placeframe/localizer-rocm:latest"
        - "ghcr.io/outernet-foundation/placeframe/localizer-rocm:${LOCALIZER_SHA}"
      additional_contexts:
        neural-networks-base: "target:neural-networks-base-rocm"
