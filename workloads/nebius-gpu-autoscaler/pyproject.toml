[project]
name = "nebius-gpu-autoscaler"
version = "0.1.0"
description = "Reconciles Nebius GPU instances against unschedulable reconstructor pods"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "kubernetes>=34.1.0",
    "nebius>=0.6.35",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.10.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nebius_gpu_autoscaler"]

[project.scripts]
nebius-gpu-autoscaler = "nebius_gpu_autoscaler.main:main"
