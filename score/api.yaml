apiVersion: score.dev/v1b1
metadata:
  name: api
containers:
  api:
    image: ghcr.io/outernet-foundation/placeframe/api:tree-70fd47ea882fbc08321b1646ed9fd3c7f8801807
    variables:
      POSTGRES_HOST: ${resources.db.host}
      DATABASE_NAME: ${resources.db.name}
      DATABASE_API_USER: ${resources.db.username}
      DATABASE_API_USER_PASSWORD: ${resources.db.password}
      AUTH_MODE: none
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
service:
  ports:
    http:
      port: 8000
      targetPort: 8000
resources:
  db:
    type: postgres
