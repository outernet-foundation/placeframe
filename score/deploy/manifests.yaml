apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: minio-bucket
spec:
  backoffLimit: 30
  template:
    spec:
      containers:
        - command:
            - /bin/sh
            - -c
            - mc alias set local http://minio:9000 $(MINIO_ACCESS_KEY) $(MINIO_SECRET_KEY) && mc mb --ignore-existing local/reconstructions
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: MINIO_ACCESS_KEY
                  name: placeframe-secrets
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: MINIO_SECRET_KEY
                  name: placeframe-secrets
          image: docker.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
          name: bucket
      restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: pf-postgres-create
spec:
  backoffLimit: 30
  template:
    spec:
      containers:
        - command:
            - uv
            - run
            - --no-sync
            - python
            - -m
            - src.main
            - --op
            - create
            - --name
            - placeframe
            - --owner-password
            - $(DATABASE_OWNER_PASSWORD)
            - --api-user-password
            - $(DATABASE_API_USER_PASSWORD)
            - --auth-user-password
            - $(DATABASE_AUTH_USER_PASSWORD)
            - --orchestration-user-password
            - $(DATABASE_ORCHESTRATION_USER_PASSWORD)
          env:
            - name: POSTGRES_HOST
              value: pf-postgres
            - name: POSTGRES_ADMIN_USER
              value: postgres
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_ADMIN_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_OWNER_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_API_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_API_USER_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_AUTH_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_AUTH_USER_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_ORCHESTRATION_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_ORCHESTRATION_USER_PASSWORD
                  name: placeframe-secrets
          image: ghcr.io/outernet-foundation/placeframe/database-manager:tree-b2871fd5da35002c9d9821b7e84c95bf9229743d
          name: create
          volumeMounts:
            - mountPath: /mnt/efs
              name: efs
      restartPolicy: OnFailure
      volumes:
        - emptyDir: {}
          name: efs
---
apiVersion: batch/v1
