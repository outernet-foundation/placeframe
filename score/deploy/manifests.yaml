            - name: DB_USER
              value: placeframe_owner
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_OWNER_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_SCHEMA_DIR
              value: database
            - name: ALLOWED_HAZARDS
              value: HAS_UNTRACKABLE_DEPENDENCIES
          image: ghcr.io/outernet-foundation/placeframe/database-migrator:tree-9145734624c8ad9c1c62fafaf894fe702bb2a878
          name: migrate
      restartPolicy: OnFailure
