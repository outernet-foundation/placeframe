apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  serviceName: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - args:
            - start-dev
            - --import-realm
            - --health-enabled=true
          env:
            - name: PUBLIC_URL
              valueFrom:
                secretKeyRef:
                  key: PUBLIC_URL
                  name: placeframe-secrets
            - name: KC_HOSTNAME
              valueFrom:
                secretKeyRef:
                  key: KEYCLOAK_HOSTNAME
                  name: placeframe-secrets
            - name: KC_HOSTNAME_ADMIN
              valueFrom:
                secretKeyRef:
                  key: KEYCLOAK_HOSTNAME
                  name: placeframe-secrets
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "true"
            - name: KEYCLOAK_ACCESS_TOKEN_LIFESPAN
              value: "3600"
            - name: KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT
              value: "2592000"
            - name: KEYCLOAK_SSO_SESSION_MAX_LIFESPAN
              value: "2592000"
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: KEYCLOAK_ADMIN_PASSWORD
                  name: placeframe-secrets
          image: quay.io/keycloak/keycloak:26.3.5@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
          name: keycloak
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
          volumeMounts:
            - mountPath: /opt/keycloak/data/import
              name: import
              readOnly: true
            - mountPath: /opt/keycloak/data
              name: data
      initContainers:
        - image: ghcr.io/outernet-foundation/placeframe/auth-initializer:tree-e07604ba98bd42864a9fbba9aca9ba09153bb512
          name: auth-initializer
          volumeMounts:
            - mountPath: /keycloak_import
              name: import
            - mountPath: /auth_data
              name: auth-data
      securityContext:
        fsGroup: 1000
      volumes:
        - emptyDir: {}
          name: import
        - emptyDir: {}
          name: auth-data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: minio
  serviceName: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: minio
    spec:
      containers:
        - args:
            - server
            - /data
            - --console-address
            - :9001
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  key: MINIO_ACCESS_KEY
                  name: placeframe-secrets
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: MINIO_SECRET_KEY
                  name: placeframe-secrets
          image: docker.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          name: minio
          ports:
            - containerPort: 9000
          volumeMounts:
            - mountPath: /data
              name: data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 50Gi
        storageClassName: hcloud-volumes
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: pf-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: pf-postgres
  serviceName: pf-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: pf-postgres
    spec:
      containers:
        - command:
            - /usr/local/bin/entrypoint-wrapper.sh
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_ADMIN_PASSWORD
                  name: placeframe-secrets
          image: ghcr.io/outernet-foundation/placeframe/postgres:tree-9fa79b21f52844967ea3e71af0e579a9fe6fc23b
          name: postgres-db
          ports:
            - containerPort: 5432
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: pv-data
  volumeClaimTemplates:
    - metadata:
        name: pv-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
        storageClassName: hcloud-volumes
