# Kubernetes twin of placeframe-postgres.provisioners.yaml. Emits a Service +
# StatefulSet (real Placeframe postgres) + create/migrate Jobs. Secrets are NOT
# generated or emitted here: every password is referenced from the externally
# managed `placeframe-secrets` Secret (created by the Pulumi infra program), so the
# generated manifests contain zero secret values and are safe to commit for GitOps.
# Register via: score-k8s init --provisioners <this file>.
- uri: template://placeframe/postgres-k8s
  type: placeframe-postgres
  description: Placeframe postgres with placeframe_* roles created by database-manager (Kubernetes).
  state: |
    service: pf-postgres
    dbName: placeframe
  outputs: |
    host: {{ .State.service }}
    port: 5432
    name: {{ .State.dbName }}
    owner_username: {{ .State.dbName }}_owner
    api_username: {{ .State.dbName }}_api_user
    auth_username: {{ .State.dbName }}_auth_user
    orchestration_username: {{ .State.dbName }}_orchestration_user
    api_password: {{ encodeSecretRef "placeframe-secrets" "DATABASE_API_USER_PASSWORD" }}
    auth_password: {{ encodeSecretRef "placeframe-secrets" "DATABASE_AUTH_USER_PASSWORD" }}
    orchestration_password: {{ encodeSecretRef "placeframe-secrets" "DATABASE_ORCHESTRATION_USER_PASSWORD" }}
  manifests: |
    - apiVersion: v1
      kind: Service
      metadata:
        name: {{ .State.service }}
      spec:
        selector:
          app.kubernetes.io/instance: {{ .State.service }}
        ports:
        - port: 5432
          targetPort: 5432
    - apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: {{ .State.service }}
        annotations:
          argocd.argoproj.io/sync-options: Prune=false
      spec:
        replicas: 1
        serviceName: {{ .State.service }}
        selector:
          matchLabels:
            app.kubernetes.io/instance: {{ .State.service }}
        template:
          metadata:
            labels:
              app.kubernetes.io/instance: {{ .State.service }}
          spec:
            containers:
            - name: postgres-db
              image: ghcr.io/outernet-foundation/placeframe/postgres:tree-2805e66eb8f946b3ff6fb0dc220b080d9bb0d984
              command: ["/usr/local/bin/entrypoint-wrapper.sh"]
              ports:
              - containerPort: 5432
              env:
              - name: PGDATA
                value: /var/lib/postgresql/data/pgdata
              - name: POSTGRES_USER
                value: postgres
              - name: POSTGRES_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: POSTGRES_ADMIN_PASSWORD
              volumeMounts:
              - name: pv-data
                mountPath: /var/lib/postgresql/data
        volumeClaimTemplates:
        - metadata:
            name: pv-data
          spec:
            accessModes: [ReadWriteOnce]
            storageClassName: hcloud-volumes
            resources:
              requests:
                storage: 1Gi
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: {{ .State.service }}-create
      spec:
        backoffLimit: 30
        template:
          spec:
            restartPolicy: OnFailure
            containers:
            - name: create
              image: ghcr.io/outernet-foundation/placeframe/database-manager:tree-fb027ea674d00a8c9079aa26c13bac5550f263f9
              command: ["uv","run","--no-sync","python","-m","src.main","--op","create","--name","{{ .State.dbName }}","--owner-password","$(DATABASE_OWNER_PASSWORD)","--api-user-password","$(DATABASE_API_USER_PASSWORD)","--auth-user-password","$(DATABASE_AUTH_USER_PASSWORD)","--orchestration-user-password","$(DATABASE_ORCHESTRATION_USER_PASSWORD)"]
              env:
              - name: POSTGRES_HOST
                value: {{ .State.service }}
              - name: POSTGRES_ADMIN_USER
                value: postgres
              - name: POSTGRES_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: POSTGRES_ADMIN_PASSWORD
              - name: DATABASE_OWNER_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: DATABASE_OWNER_PASSWORD
              - name: DATABASE_API_USER_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: DATABASE_API_USER_PASSWORD
              - name: DATABASE_AUTH_USER_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: DATABASE_AUTH_USER_PASSWORD
              - name: DATABASE_ORCHESTRATION_USER_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: DATABASE_ORCHESTRATION_USER_PASSWORD
              volumeMounts:
              - name: efs
                mountPath: /mnt/efs
            volumes:
            - name: efs
              emptyDir: {}
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: {{ .State.service }}-migrate
      spec:
        backoffLimit: 30
        template:
          spec:
            restartPolicy: OnFailure
            containers:
            - name: migrate
              image: ghcr.io/outernet-foundation/placeframe/database-migrator:tree-0e358a9da5301a6399d56b4f9248d95edcd8f0c7
              env:
              - name: DB_HOST
                value: {{ .State.service }}
              - name: DB_PORT
                value: "5432"
              - name: DB_NAME
                value: {{ .State.dbName }}
              - name: DB_USER
                value: {{ .State.dbName }}_owner
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: DATABASE_OWNER_PASSWORD
              - name: DATABASE_SCHEMA_DIR
                value: database
              - name: ALLOWED_HAZARDS
                value: HAS_UNTRACKABLE_DEPENDENCIES
