# Custom Score provisioner: a real Placeframe postgres (PostGIS) whose placeframe_*
# roles and database are created by the actual database-manager image (the same
# create-database logic the compose stack runs), rather than a vanilla postgres with a
# single generated role. Registered via: score-compose init --provisioners <this file>.
#
# HERMETIC BY CONSTRUCTION: this provisioner resolves no secret at generation time. Every
# credential is emitted as a literal ${VAR:?err} string, exactly as the hand-authored
# compose.yml writes it, and docker compose resolves it from --env-file at run time. That
# is what lets the generated compose.yaml be committed and consumed unchanged by
# `uv run up --compose-file score/compose.yaml`. ${...} carries no meaning to Go's template
# engine, so it passes through the provisioner and into the output verbatim.
#
# Consequently there is no `init:` block minting passwords and no password state: .env is
# the single source of truth for credentials, shared with the hand-authored stack.
- uri: template://placeframe/postgres
  type: placeframe-postgres
  description: Placeframe postgres with placeframe_* roles created by database-manager.
  state: |
    dbName: placeframe
    serviceName: pf-postgres
  # Distinct outputs per role, matching what api / lease-server expect. The password
  # outputs are placeholder strings, not values.
  outputs: |
    host: {{ .State.serviceName }}
    port: 5432
    name: {{ .State.dbName }}
    owner_username: {{ .State.dbName }}_owner
    owner_password: ${DATABASE_OWNER_PASSWORD:?err}
    api_username: {{ .State.dbName }}_api_user
    api_password: ${DATABASE_API_USER_PASSWORD:?err}
    auth_username: {{ .State.dbName }}_auth_user
    auth_password: ${DATABASE_AUTH_USER_PASSWORD:?err}
    orchestration_username: {{ .State.dbName }}_orchestration_user
    orchestration_password: ${DATABASE_ORCHESTRATION_USER_PASSWORD:?err}
  volumes: |
    pf-postgres-data:
      driver: local
    pf-postgres-efs:
      driver: local
  services: |
    {{ .State.serviceName }}:
      image: ghcr.io/outernet-foundation/placeframe/postgres:{{ env "POSTGRES_SHA" }}
      entrypoint: /usr/local/bin/entrypoint-wrapper.sh
      restart: always
      environment:
        POSTGRES_USER: "${POSTGRES_ADMIN_USER:?err}"
        POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?err}"
      volumes:
      - type: volume
        source: pf-postgres-data
        target: /var/lib/postgresql/data
      healthcheck:
        test: ["CMD", "pg_isready", "-U", "${POSTGRES_ADMIN_USER:?err}"]
        interval: 2s
        timeout: 2s
        retries: 30
    {{ .State.serviceName }}-create:
      image: ghcr.io/outernet-foundation/placeframe/database-manager:{{ env "DATABASE_MANAGER_SHA" }}
      depends_on:
        {{ .State.serviceName }}:
          condition: service_healthy
      restart: "no"
      environment:
        POSTGRES_HOST: {{ .State.serviceName }}
        POSTGRES_ADMIN_USER: "${POSTGRES_ADMIN_USER:?err}"
        POSTGRES_ADMIN_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?err}"
      volumes:
      - type: volume
        source: pf-postgres-efs
        target: /mnt/efs
      entrypoint: >-
        uv run --no-sync python -m src.main --op create --name {{ .State.dbName }}
        --owner-password ${DATABASE_OWNER_PASSWORD:?err}
        --api-user-password ${DATABASE_API_USER_PASSWORD:?err}
        --auth-user-password ${DATABASE_AUTH_USER_PASSWORD:?err}
        --orchestration-user-password ${DATABASE_ORCHESTRATION_USER_PASSWORD:?err}
    {{ .State.serviceName }}-migrate:
      image: ghcr.io/outernet-foundation/placeframe/database-migrator:{{ env "DATABASE_MIGRATOR_SHA" }}
      depends_on:
        {{ .State.serviceName }}-create:
          condition: service_completed_successfully
      restart: "no"
      environment:
        DB_HOST: {{ .State.serviceName }}
        DB_PORT: "5432"
        DB_NAME: {{ .State.dbName }}
        DB_USER: {{ .State.dbName }}_owner
        DB_PASSWORD: "${DATABASE_OWNER_PASSWORD:?err}"
        DATABASE_SCHEMA_DIR: database
        ALLOWED_HAZARDS: HAS_UNTRACKABLE_DEPENDENCIES
