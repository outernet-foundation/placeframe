# Custom Score provisioner: a real Placeframe MinIO at a FIXED service name (minio) with
# the real buckets (dev-captures, dev-reconstructions, loki), using digest-pinned images.
# The built-in s3 provisioner gives a randomly-named minio + a random bucket, which loki
# (its config hardcodes endpoint minio:9000 + bucket loki) cannot use, and it mints random
# credentials at generation time. Declaring `type: s3` here overrides the built-in, because
# custom provisioners are matched ahead of the defaults on a first-match policy.
# Register via: score-compose init --provisioners <this file>.
#
# HERMETIC BY CONSTRUCTION: the credentials are literal ${VAR:?err} placeholders, matching
# how compose.yml writes MINIO_ROOT_USER / MINIO_ROOT_PASSWORD, so nothing is resolved at
# generation time and .env stays the single source of truth.
- uri: template://placeframe/s3
  type: s3
  description: Placeframe MinIO at fixed name minio with the real buckets, credentials from .env.
  outputs: |
    endpoint: http://minio:9000
    access_key_id: ${MINIO_ACCESS_KEY:?err}
    secret_key: ${MINIO_SECRET_KEY:?err}
    bucket: dev-reconstructions
  volumes: |
    minio-data:
      driver: local
  services: |
    minio:
      image: docker.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
      restart: always
      command: server /data --console-address ":9001"
      environment:
        MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:?err}"
        MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?err}"
      volumes:
      - type: volume
        source: minio-data
        target: /data
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
        interval: 2s
        timeout: 2s
        retries: 30
    minio-init:
      image: docker.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
      depends_on:
        minio:
          condition: service_healthy
      restart: "no"
      entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:?err} ${MINIO_SECRET_KEY:?err} && mc mb --ignore-existing local/dev-captures && mc mb --ignore-existing local/dev-reconstructions && mc mb --ignore-existing local/loki"]
