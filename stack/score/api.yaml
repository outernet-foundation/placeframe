apiVersion: score.dev/v1b1
metadata:
  name: api
  annotations:
    outernet.internal/probe-adapter: python-urllib
    # Dev defaults for the generated dev overlay (up --dev turns the pairs into
    # ${NAME:-default} env holes); the variables below bake prod-safe literals.
    outernet.internal/dev-toggles: RELOAD=true,DEBUG_API=true,DEBUG_WAIT_API=false
containers:
  api:
    image: ghcr.io/outernet-foundation/placeframe/api:${API_SHA}
    variables:
      PUBLIC_URL: ${resources.config.public_url}
      AUTH_ISSUER_URL: ${resources.config.auth_issuer_url}
      AUTH_JWKS_URL: ${resources.config.auth_jwks_url}
      AUTH_AUTHORIZATION_ENDPOINT: ${resources.config.auth_authorization_endpoint}
      AUTH_TOKEN_ENDPOINT: ${resources.config.auth_token_endpoint}
      AUTH_AUDIENCE: ${resources.config.auth_audience}
      DEPLOYMENT_ENVIRONMENT: ${resources.config.deployment_environment}
      POSTGRES_HOST: ${resources.db.host}
      DATABASE_NAME: ${resources.db.name}
      DATABASE_API_USER: ${resources.db.api_username}
      DATABASE_API_USER_PASSWORD: ${resources.db.api_password}
      DATABASE_AUTH_USER: ${resources.db.auth_username}
      DATABASE_AUTH_USER_PASSWORD: ${resources.db.auth_password}
      DATABASE_ORCHESTRATION_USER: ${resources.db.orchestration_username}
      DATABASE_ORCHESTRATION_USER_PASSWORD: ${resources.db.orchestration_password}
      LOCALIZER_CONTAINER_URL: http://${resources.localizer.hostname}:${resources.localizer.port}
      LOKI_URL: ${resources.observability.loki_url}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${resources.observability.otlp_endpoint}
      SERVICE_VERSION: ${API_SHA}
      S3_ENDPOINT_URL: ${resources.bucket.endpoint}
      S3_ACCESS_KEY: ${resources.bucket.access_key_id}
      S3_SECRET_KEY: ${resources.bucket.secret_key}
      RECONSTRUCTIONS_BUCKET: ${resources.bucket.bucket}
      CAPTURES_BUCKET: ${resources.bucket.captures_bucket}
      RELOAD: "false"
      DEBUG_API: "false"
      DEBUG_WAIT_API: "false"
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
service:
  ports:
    http:
      port: 8000
      targetPort: 8000
resources:
  db:
    type: placeframe-postgres
    id: placeframe-db
  bucket:
    type: s3
    id: placeframe-bucket
  localizer:
    type: service-port
    id: localizer-http
    params:
      workload: localizer
      port: http
  config:
    type: placeframe-config
    id: placeframe-config
  observability:
    type: observability
    id: placeframe-observability
