apiVersion: score.dev/v1b1
metadata:
  name: localizer
  annotations:
    boatyard/gpu: "true"
    # Hold this container out of boatyard up and let the mode switcher start it
    boatyard/autostart: "false"
    boatyard/probe-adapter: python-urllib
    boatyard/dockerfile: localizer=workloads/localizer/Dockerfile
containers:
  localizer:
    variables:
      S3_ENDPOINT_URL: ${resources.bucket.endpoint}
      S3_ACCESS_KEY: ${resources.bucket.access_key_id}
      S3_SECRET_KEY: ${resources.bucket.secret_key}
      RECONSTRUCTIONS_BUCKET: ${resources.bucket.bucket}
      DEPLOYMENT_ENVIRONMENT: ${resources.config.deployment_environment}
      SERVICE_PORT: ${resources.self-port.port}
      SERVICE_VERSION: ${LOCALIZER_SHA}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${resources.observability.otlp_endpoint}
    livenessProbe:
      httpGet:
        path: /version
        port: 8000
    readinessProbe:
      httpGet:
        path: /version
        port: 8000
service:
  ports:
    http:
      port: 8000
      targetPort: 8000
resources:
  self-port:
    type: service-port
    id: localizer-http-self
    params:
      workload: localizer
      port: http
  bucket:
    type: s3
    id: placeframe-bucket
  config:
    type: placeframe-config
    id: placeframe-config
  observability:
    type: observability
    id: placeframe-observability
