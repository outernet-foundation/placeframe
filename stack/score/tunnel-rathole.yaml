apiVersion: score.dev/v1b1
metadata:
  name: tunnel-rathole
containers:
  rathole-client:
    image: ghcr.io/outernet-foundation/placeframe/rathole-client:${RATHOLE_CLIENT_SHA}
    # RATHOLE_SERVICES is a literal: the relay forwards by Docker DNS name to
    # whichever gateway container runs alongside it in the assembled project.
    variables:
      ENGINEER_NAME: ${resources.config.engineer_name}
      TUNNEL_CONTROL_ENDPOINT: ${resources.config.control_endpoint}
      TUNNEL_TOKEN: ${resources.config.token}
      RATHOLE_SERVICES: gateway:tcp:gateway:8443
resources:
  config:
    type: tunnel-config
    id: placeframe-tunnel-config
