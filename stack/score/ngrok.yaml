apiVersion: score.dev/v1b1
metadata:
  name: ngrok
  annotations:
    boatyard/restart: on-failure
boatyard:
  lock:
    ngrok: NGROK_IMAGE
listeners:
  admin: 4040
containers:
  ngrok:
    # Expand the domain in a shell because score substitutes nothing inside command args
    # Forward to the gateway at its reserved service name on :8443
    command:
      - /bin/sh
      - -c
      - exec ngrok http --domain=${NGROK_DOMAIN:-} --upstream-protocol=http1 --log=stdout http://boatyard-gateway:8443
    variables:
      NGROK_AUTHTOKEN: ${resources.config.ngrok_authtoken}
      NGROK_DOMAIN: ${resources.config.ngrok_domain}
resources:
  config:
    type: tunnel-config
    id: placeframe-tunnel-config
