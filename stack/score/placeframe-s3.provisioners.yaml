# Custom Score provisioner: a real Placeframe SeaweedFS at a FIXED service name (seaweedfs)
# with the real buckets (dev-captures, dev-reconstructions, loki). The built-in s3
# provisioner gives a randomly-named store + a random bucket, which loki (its config
# hardcodes the endpoint and the loki bucket) cannot use, and it mints random credentials at
# generation time. Declaring `type: s3` here overrides the built-in, because custom
# provisioners are matched ahead of the defaults on a first-match policy.
# Register via: score-compose init --provisioners <this file>.
#
# HERMETIC BY CONSTRUCTION: the credentials are literal ${VAR:?err} placeholders, matching
# how compose.yml writes S3_ACCESS_KEY / S3_SECRET_KEY, so nothing is resolved at generation
# time and .env stays the single source of truth.
- uri: template://placeframe/s3
  type: s3
  description: Placeframe SeaweedFS at fixed name seaweedfs with the real buckets, credentials from .env.
  outputs: |
    endpoint: http://seaweedfs:8333
    access_key_id: ${S3_ACCESS_KEY:?err}
    secret_key: ${S3_SECRET_KEY:?err}
    bucket: dev-reconstructions
  volumes: |
    seaweedfs-data:
      driver: local
  services: |
    seaweedfs:
      image: ghcr.io/outernet-foundation/placeframe/seaweedfs:{{ env "SEAWEEDFS_SHA" }}
      restart: always
      entrypoint: /usr/local/bin/entrypoint-wrapper.sh
      command: server -filer -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
      environment:
        S3_ACCESS_KEY: "${S3_ACCESS_KEY:?err}"
        S3_SECRET_KEY: "${S3_SECRET_KEY:?err}"
      volumes:
      - type: volume
        source: seaweedfs-data
        target: /data
      healthcheck:
        # weed binds its listeners staggered, so a single-port check passes before S3 is
        # reachable. Gate on master status AND the S3 listener.
        test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9333/cluster/status && curl -s -o /dev/null http://127.0.0.1:8333/"]
        interval: 2s
        timeout: 2s
        retries: 45
      start_period: 90s
    seaweedfs-init:
      image: ghcr.io/outernet-foundation/placeframe/s3-initializer:{{ env "S3_INITIALIZER_SHA" }}
      depends_on:
        seaweedfs:
          condition: service_healthy
      restart: "no"
      environment:
        S3_ENDPOINT_URL: "http://seaweedfs:8333"
        S3_ACCESS_KEY: "${S3_ACCESS_KEY:?err}"
        S3_SECRET_KEY: "${S3_SECRET_KEY:?err}"
        S3_BUCKETS: "dev-captures dev-reconstructions loki"
