apiVersion: score.dev/v1b1
metadata:
  name: lease-server
containers:
  lease-server:
    image: ghcr.io/outernet-foundation/placeframe/lease-server:${LEASE_SERVER_SHA}
    variables:
      POSTGRES_HOST: ${resources.db.host}
      DATABASE_NAME: ${resources.db.name}
      DATABASE_ORCHESTRATION_USER: ${resources.db.orchestration_username}
      DATABASE_ORCHESTRATION_USER_PASSWORD: ${resources.db.orchestration_password}
      DEPLOYMENT_ENVIRONMENT: development
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
service:
  ports:
    http:
      port: 8000
      targetPort: 8000
resources:
  db:
    type: placeframe-postgres
    id: placeframe-db
