# Kubernetes twin of compose/observability.yaml. Loki and grafana arrive as the
# digest-pinned official Grafana charts declared under generate-score's charts:
# section (rendered by helm template into this same manifests.yaml — their
# Services land at the fixed DNS names loki:3100 and grafana:3000 the gateway
# Caddyfile proxies). Alloy's chart has no OCI artifact, so it is the hand-written
# twin: Deployment + Service + ConfigMap, the seaweedfs-k8s pattern. The
# ConfigMap body is a mirror of workloads/alloy/config.alloy — keep the two in
# sync; the compose rendering binds the committed file directly.
- uri: template://placeframe/observability-k8s
  type: observability
  description: Loki/Grafana via official charts plus a hand-written alloy relay; outputs the fixed service URLs.
  state: |
    alloyService: alloy
  outputs: |
    loki_url: http://loki:3100
    otlp_endpoint: http://{{ .State.alloyService }}:4317
  manifests: |
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: {{ .State.alloyService }}-config
      data:
        config.alloy: |
          // OTLP/gRPC receiver → attributes processor (label-cardinality policy) → Loki
          // exporter → loki.write. Producers ship OTel log records with full SemConv
          // resource attributes (service.name, service.namespace, service.instance.id,
          // service.version, deployment.environment.name, container.name). Only the
          // low-cardinality subset becomes Loki indexed labels; everything else rides
          // as Loki structured metadata. Write endpoint is env-driven so this single
          // config serves both the main backend stack (writes to loki:3100) and the
          // ZED box stack (writes to 127.0.0.1:3100).

          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }

            output {
              logs = [otelcol.processor.attributes.label_promotion.input]
            }
          }

          // The Loki exporter promotes resource attributes named in the
          // `loki.resource.labels` record attribute to indexed Loki labels. Everything
          // else stays as structured metadata. Severity is promoted automatically.
          otelcol.processor.attributes "label_promotion" {
            action {
              key    = "loki.resource.labels"
              value  = "service.name,deployment.environment.name"
              action = "insert"
            }

            output {
              logs = [otelcol.exporter.loki.default.input]
            }
          }

          otelcol.exporter.loki "default" {
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = sys.env("LOKI_WRITE_ENDPOINT")
            }
          }
    - apiVersion: v1
      kind: Service
      metadata:
        name: {{ .State.alloyService }}
      spec:
        selector:
          app.kubernetes.io/instance: {{ .State.alloyService }}
        ports:
        - port: 4317
          targetPort: 4317
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ .State.alloyService }}
      spec:
        replicas: 1
        selector:
          matchLabels:
            app.kubernetes.io/instance: {{ .State.alloyService }}
        template:
          metadata:
            labels:
              app.kubernetes.io/instance: {{ .State.alloyService }}
          spec:
            containers:
            - name: alloy
              image: ghcr.io/outernet-foundation/mirror/docker.io/grafana/alloy:v1.9.0@sha256:32bc0ba6bad75ca24bdf4a6d2dd793a564dff06b6446927699c08d9f9c749c6e
              args: ["run", "/etc/alloy/config.alloy"]
              ports:
              - containerPort: 4317
              env:
              - name: LOKI_WRITE_ENDPOINT
                value: http://loki:3100/loki/api/v1/push
              volumeMounts:
              - name: config
                mountPath: /etc/alloy
            volumes:
            - name: config
              configMap:
                name: {{ .State.alloyService }}-config
