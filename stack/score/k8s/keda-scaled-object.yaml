# K8s twin of compose/keda-scaled-object.yaml
- uri: template://placeframe/keda-scaled-object-k8s
  type: keda-scaled-object
  description: KEDA scale-to-zero on queued reconstructions; password from placeframe-secrets.
  state:
    host: pf-postgres
    port: "5432"
    database: placeframe
    username: placeframe_orchestration_user
    passwordKey: DATABASE_ORCHESTRATION_USER_PASSWORD
  manifests:
    - apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: "{{ .SourceWorkload }}"
      spec:
        scaleTargetRef:
          name: "{{ .SourceWorkload }}"
        minReplicaCount: 0
        maxReplicaCount: 8
        cooldownPeriod: 300
        triggers:
          - type: postgresql
            metadata:
              host: "{{ .State.host }}"
              port: "{{ .State.port }}"
              dbName: "{{ .State.database }}"
              userName: "{{ .State.username }}"
              sslmode: disable
              # A manifest literal because templated values render after the yaml dump with no escaping
              query: "SELECT count(*) FROM reconstructions WHERE status = 'queued'"
              targetQueryValue: "1"
            authenticationRef:
              name: "{{ .SourceWorkload }}-pg-trigger"
    - apiVersion: keda.sh/v1alpha1
      kind: TriggerAuthentication
      metadata:
        name: "{{ .SourceWorkload }}-pg-trigger"
      spec:
        secretTargetRef:
          - parameter: password
            name: placeframe-secrets
            key: "{{ .State.passwordKey }}"
