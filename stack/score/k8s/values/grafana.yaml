image:
  lock-image:
    key: GRAFANA_IMAGE
    digest_field: sha
initChownData:
  enabled: false
testFramework:
  enabled: false
admin:
  existingSecret: placeframe-secrets
  userKey: GRAFANA_ADMIN_USER
  passwordKey: GRAFANA_ADMIN_PASSWORD
service:
  port: 3000
env:
  GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  # Request-derived placeholders because no PUBLIC_URL exists at generation
  GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
datasources:
  datasources.yaml:
    include-yaml: workloads/grafana/provisioning/datasources/datasources.yaml
