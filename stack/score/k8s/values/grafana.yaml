# Values for the grafana chart (ghcr.io/grafana/helm-charts/grafana,
# digest-pinned in docker-devkit.yaml). The Service keeps the fixed name and port
# the gateway Caddyfile proxies (grafana:3000). No anonymous access on this tier
# (unlike the compose dev stack): admin credentials are injected from the
# externally managed placeframe-secrets Secret. Root URL uses grafana's
# request-derived placeholders so no PUBLIC_URL needs to be composed at
# generation; the OAuth block joins when the k8s keycloak edge lands.
image:
  registry: ghcr.io/outernet-foundation/mirror/docker.io/grafana
  repository: grafana
  tag: 11.6.0
  sha: 62d2b9d20a19714ebfe48d1bb405086081bc602aa053e28cf6d73c7537640dfb
initChownData:
  enabled: false
testFramework:
  enabled: false
admin:
  existingSecret: placeframe-secrets
  userKey: GRAFANA_ADMIN_USER
  passwordKey: GRAFANA_ADMIN_PASSWORD
service:
  port: 3000
env:
  GF_SERVER_SERVE_FROM_SUB_PATH: "true"
  GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki:3100
        isDefault: true
