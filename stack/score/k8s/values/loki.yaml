global:
  extraEnvFrom:
    - secretRef:
        name: placeframe-secrets
deploymentMode: SingleBinary
loki:
  image:
    lock-image: LOKI_IMAGE
  # Blank the templated config because calculatedConfig merges structuredConfig onto it
  config: ""
  structuredConfig:
    include-yaml: workloads/loki/config.yaml
singleBinary:
  replicas: 1
  # The single-binary template reads its own extraArgs, not the global ones
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: placeframe-secrets
# Zero the SimpleScalable roles because single-binary owns the whole deployment
read:
  replicas: 0
backend:
  replicas: 0
write:
  replicas: 0
lokiCanary:
  enabled: false
test:
  enabled: false
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
sidecar:
  rules:
    enabled: false
