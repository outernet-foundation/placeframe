# K8s twin of compose/oidc-issuer.yaml
- uri: template://placeframe/oidc-issuer-k8s
  type: oidc-issuer
  description: Keycloak env surface with the realm converged by the admin-API configurator.
  state:
    instance: keycloak
    realm: placeframe-dev
    keycloak_port: {listener: keycloak.http}
  outputs:
    admin_password: '{{ encodeSecretRef "placeframe-secrets" "KEYCLOAK_ADMIN_PASSWORD" }}'
    hostname: '{{ encodeSecretRef "placeframe-secrets" "KEYCLOAK_HOSTNAME" }}'
    # Soft passthrough because a baked JWKS URL crashes anonymous boots
    certs_url: '{{ encodeSecretRef "placeframe-secrets" "AUTH_JWKS_URL" }}'
    realm: "{{ .State.realm }}"
  manifests:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: "{{ .State.instance }}-realm"
        annotations:
          argocd.argoproj.io/hook: Sync
          argocd.argoproj.io/hook-weight: "10"
          argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
      spec:
        backoffLimit: 30
        template:
          spec:
            restartPolicy: OnFailure
            containers:
            - name: configurator
              image: {dockerfile: workloads/auth-initializer/Dockerfile}
              env:
              - name: KEYCLOAK_URL
                value: http://{{ .State.instance }}:{{ .State.keycloak_port }}
              - name: KC_BOOTSTRAP_ADMIN_USERNAME
                value: admin
              - name: KC_BOOTSTRAP_ADMIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: KEYCLOAK_ADMIN_PASSWORD
              - name: PUBLIC_URL
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: PUBLIC_URL
              - name: KEYCLOAK_ACCESS_TOKEN_LIFESPAN
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: KEYCLOAK_ACCESS_TOKEN_LIFESPAN
              - name: KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT
              - name: KEYCLOAK_SSO_SESSION_MAX_LIFESPAN
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: KEYCLOAK_SSO_SESSION_MAX_LIFESPAN
              - name: SEED_TEST_USERS
                valueFrom:
                  secretKeyRef:
                    name: placeframe-secrets
                    key: SEED_TEST_USERS
