# Tier-neutral secrets/env contract: every ALL_CAPS key either rendering consumes must be
# declared here — generate-score validates each artifact's consumed keys (compose ${VAR}
# holes, k8s secretKeyRef entries into placeframe-secrets) are a subset of this mapping.
# Keys marked mint:true ride the externally managed placeframe-secrets Secret (the
# generated stack/generated/secrets.txt lists exactly those for the k3d recipe and the
# Pulumi sync); the rest are compose runtime knobs filled from .env or workloads/images.lock.

POSTGRES_ADMIN_PASSWORD:
  description: Postgres superuser password, both tiers.
  mint: true
DATABASE_OWNER_PASSWORD:
  description: Owner-role password for the api database, both tiers.
  mint: true
DATABASE_API_USER_PASSWORD:
  description: Api-role password, both tiers.
  mint: true
DATABASE_AUTH_USER_PASSWORD:
  description: Auth-role password, both tiers.
  mint: true
DATABASE_ORCHESTRATION_USER_PASSWORD:
  description: Orchestration-role password, both tiers.
  mint: true
S3_ACCESS_KEY:
  description: SeaweedFS access key (api, reconstructor, loki), both tiers.
  mint: true
S3_SECRET_KEY:
  description: SeaweedFS secret key, both tiers.
  mint: true
KEYCLOAK_ADMIN_PASSWORD:
  description: Keycloak admin password, both tiers.
  mint: true
KEYCLOAK_HOSTNAME:
  description: Keycloak external hostname the k8s edge advertises.
  mint: true
GRAFANA_ADMIN_USER:
  description: Grafana admin username on the k8s tier (chart admin.existingSecret).
  mint: true
GRAFANA_ADMIN_PASSWORD:
  description: Grafana admin password on the k8s tier.
  mint: true
PUBLIC_URL:
  description: Canonical public URL the gateway and auth endpoints advertise.
  mint: true
AUTH_ISSUER_URL:
  description: OIDC issuer; empty selects anonymous auth.
  mint: true
AUTH_JWKS_URL:
  description: Explicit JWKS endpoint (split-horizon; never derived from the issuer).
  mint: true
AUTH_AUTHORIZATION_ENDPOINT:
  description: Explicit authorization endpoint; empty for anonymous.
  mint: true
AUTH_TOKEN_ENDPOINT:
  description: Explicit token endpoint; empty for anonymous.
  mint: true
AUTH_AUDIENCE:
  description: OIDC audience the api validates.
  mint: true
DEPLOYMENT_ENVIRONMENT:
  description: Deployment environment label (development/staging/production).
  mint: true
POSTGRES_ADMIN_USER:
  description: Postgres superuser name, both tiers; must match the name the cluster was initialized with.
  mint: true
GRAFANA_PORT: Compose host port publishing grafana.
SEAWEEDFS_ADMIN_PORT: Compose host port publishing the SeaweedFS admin UI.
KEYCLOAK_IMAGE: Keycloak image reference, filled from workloads/images.lock.
LOKI_IMAGE: Loki image reference, filled from workloads/images.lock.
GRAFANA_IMAGE: Grafana image reference, filled from workloads/images.lock.
ALLOY_IMAGE: Alloy image reference, filled from workloads/images.lock.
SEAWEEDFS_AUDIT_IMAGE: Fluent-bit audit-sink image reference, filled from workloads/images.lock.
ALPINE_IMAGE: Wait-for-resources gate image, filled from workloads/images.lock.
