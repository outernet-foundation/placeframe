# OIDC issuer provisioner (compose): local counterpart of k8s/oidc-issuer.yaml.
# The type is named for the protocol, not the provider — a swapped issuer implementation
# registers a different provisioner for the same `oidc-issuer` type. A dev keycloak plus
# the post-boot configurator (auth-initializer image): it waits for the admin API, then
# creates or updates the realm from the committed export, substituting the KEYCLOAK_* and
# PUBLIC_URL holes from env. The file-import path is gone — the realm is API-converged in
# both tiers.
#
# certs_url is a soft passthrough, not the keycloak literal: the api treats issuer-unset
# with any auth endpoint set as a boot error (anonymous mode must receive it empty), and
# .env carries the keycloak JWKS URL whenever OIDC mode runs.
- uri: template://placeframe/oidc-issuer
  type: oidc-issuer
  description: Local dev keycloak with the realm converged by the admin-API configurator.
  state:
    service: keycloak
    configurator: keycloak-configurator
    realm: placeframe-dev
  outputs:
    certs_url: ${AUTH_JWKS_URL:-}
    realm: "{{ .State.realm }}"
  services:
    "{{ .State.service }}":
      image: ${KEYCLOAK_IMAGE:?err}
      command: ["start-dev", "--health-enabled=true"]
      healthcheck:
        test:
          [
            "CMD",
            "/bin/bash",
            "-c",
            "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; cat <&3 | grep -q '200 OK'",
          ]
        interval: 10s
        timeout: 5s
        retries: 20
        start_period: 30s
      environment:
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?err}
        KC_HOSTNAME: ${PUBLIC_URL:?err}/auth
        KC_HOSTNAME_ADMIN: ${PUBLIC_URL:?err}/auth
        KC_PROXY_HEADERS: xforwarded
        KC_HOSTNAME_STRICT_HTTPS: "true"
    "{{ .State.configurator }}":
      image: ghcr.io/outernet-foundation/placeframe/auth-initializer:{{ env "AUTH_INITIALIZER_SHA" }}
      depends_on:
        "{{ .State.service }}":
          condition: service_healthy
      environment:
        KEYCLOAK_URL: http://{{ .State.service }}:8080
        KC_BOOTSTRAP_ADMIN_USERNAME: admin
        KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?err}
        PUBLIC_URL: ${PUBLIC_URL:?err}
        KEYCLOAK_ACCESS_TOKEN_LIFESPAN: ${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:?err}
        KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT: ${KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT:?err}
        KEYCLOAK_SSO_SESSION_MAX_LIFESPAN: ${KEYCLOAK_SSO_SESSION_MAX_LIFESPAN:?err}
        SEED_TEST_USERS: ${SEED_TEST_USERS:-}
