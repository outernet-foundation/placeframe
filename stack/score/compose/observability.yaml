# Compose twin of k8s/observability.yaml
- uri: template://placeframe/observability
  type: observability
  description: Loki/Alloy/Grafana observability stack with fixed DNS names and .env credentials.
  state:
    realm: placeframe-dev
    loki_port: 3100
    grafana_port: 3000
    keycloak_route_path: {route: keycloak}
  outputs:
    loki_url: http://loki:{{ .State.loki_port }}
    otlp_endpoint: http://alloy:4317
  volumes:
    loki-data:
      driver: local
  services:
    # A fresh loki-data volume is image-owned 1000:1000 while loki runs as uid 10001
    # Chown at runtime because the image-side chown layer does not survive the registry cache
    initialize-loki:
      image: {lock: LOKI_IMAGE}
      user: "0:0"
      restart: "no"
      volumes:
      - type: volume
        source: loki-data
        target: /loki
      entrypoint: ["/bin/sh", "-c", "chown -R 10001:10001 /loki"]
    loki:
      route:
        path: /loki/*
        port: '{{ .State.loki_port }}'
      image: {lock: LOKI_IMAGE}
      depends_on:
        initialize-s3:
          condition: service_completed_successfully
        initialize-loki:
          condition: service_completed_successfully
      volumes:
      - type: volume
        source: loki-data
        target: /loki
      - type: bind
        source: workloads/loki/config.yaml
        target: /etc/loki/config.yaml
      command: -config.file=/etc/loki/config.yaml -config.expand-env=true
      healthcheck:
        test:
          [
            "CMD",
            "wget",
            "--quiet",
            "--tries=1",
            "--output-document=-",
            "http://localhost:{{ .State.loki_port }}/ready",
          ]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 10s
      environment:
        S3_ACCESS_KEY: "${S3_ACCESS_KEY:-admin}"
        S3_SECRET_KEY: "${S3_SECRET_KEY:-password}"
    alloy:
      image: {lock: ALLOY_IMAGE}
      depends_on:
        loki:
          condition: service_healthy
      expose:
      - "4317"
      environment:
        LOKI_WRITE_ENDPOINT: "http://loki:{{ .State.loki_port }}/loki/api/v1/push"
      command: run /etc/alloy/config.alloy
      volumes:
      - type: bind
        source: workloads/alloy/config.alloy
        target: /etc/alloy/config.alloy
    grafana:
      route:
        path: /grafana/*
        port: '{{ .State.grafana_port }}'
      image: {lock: GRAFANA_IMAGE}
      depends_on:
        loki:
          condition: service_healthy
      healthcheck:
        test:
          [
            "CMD",
            "wget",
            "--quiet",
            "--tries=1",
            "--output-document=-",
            "http://localhost:{{ .State.grafana_port }}/grafana/api/health",
          ]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 10s
      environment:
        GF_SERVER_ROOT_URL: "${PUBLIC_URL:?err}/grafana/"
        GF_SERVER_SERVE_FROM_SUB_PATH: "true"
        # Anonymous Admin exists for local dev over plain HTTP
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
        GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: placeframe-grafana
        GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: '${PUBLIC_URL:?err}{{ .State.keycloak_route_path }}/realms/{{ .State.realm }}/protocol/openid-connect/auth'
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: '${PUBLIC_URL:?err}{{ .State.keycloak_route_path }}/realms/{{ .State.realm }}/protocol/openid-connect/token'
        GF_AUTH_GENERIC_OAUTH_API_URL: '${PUBLIC_URL:?err}{{ .State.keycloak_route_path }}/realms/{{ .State.realm }}/protocol/openid-connect/userinfo'
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "'Admin'"
      volumes:
      - type: bind
        source: workloads/grafana/provisioning/datasources/datasources.yaml
        target: /etc/grafana/provisioning/datasources/datasources.yaml
