# Custom Score provisioner: a real Placeframe postgres (PostGIS) whose placeframe_*
# roles and database are created by the actual database-manager image (the same
# database-create logic the compose stack runs), rather than a vanilla postgres with a
# single generated role.
#
# HERMETIC BY CONSTRUCTION: this provisioner resolves no secret at generation time. Every
# credential is emitted as a literal ${VAR:-dev-default} string, and docker compose resolves
# it from --env-file at run time (the dev defaults ride for local stacks; a consumer
# overrides them from boatyard.values.yaml). That
# is what lets the generated compose.yaml be committed and consumed unchanged. ${...}
# carries no meaning to Go's template engine, so it passes through the provisioner and
# into the output verbatim.
#
# Consequently there is no `init:` block minting passwords and no password state: .env is
# the single source of truth for credentials.
- uri: template://placeframe/postgres
  type: placeframe-postgres
  description: Placeframe postgres with placeframe_* roles created by database-manager.
  state:
    dbName: placeframe
    serviceName: pf-postgres
  # Distinct outputs per role, matching what api / lease-server expect. The password
  # outputs are placeholder strings, not values.
  outputs:
    host: "{{ .State.serviceName }}"
    port: 5432
    name: "{{ .State.dbName }}"
    owner_username: "{{ .State.dbName }}_owner"
    owner_password: ${DATABASE_OWNER_PASSWORD:-password}
    api_username: "{{ .State.dbName }}_api_user"
    api_password: ${DATABASE_API_USER_PASSWORD:-password}
    auth_username: "{{ .State.dbName }}_auth_user"
    auth_password: ${DATABASE_AUTH_USER_PASSWORD:-password}
    orchestration_username: "{{ .State.dbName }}_orchestration_user"
    orchestration_password: ${DATABASE_ORCHESTRATION_USER_PASSWORD:-password}
  volumes:
    pf-postgres-data:
      driver: local
  services:
    "{{ .State.serviceName }}":
      image: {dockerfile: workloads/postgres/Dockerfile}
      entrypoint: /usr/local/bin/entrypoint-wrapper.sh
      environment:
        POSTGRES_USER: "${POSTGRES_ADMIN_USER:-postgres}"
        POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-password}"
      volumes:
      - type: volume
        source: pf-postgres-data
        target: /var/lib/postgresql/data
      healthcheck:
        # -h localhost forces TCP: during first-init the postgres entrypoint runs a
        # temporary server that answers on the unix socket only, so a socket probe
        # reports healthy while dependents dialing 5432 get connection refused.
        test:
          [
            "CMD",
            "pg_isready",
            "-q",
            "-h",
            "localhost",
            "-p",
            "5432",
            "-U",
            "${POSTGRES_ADMIN_USER:-postgres}",
            "-d",
            "postgres",
          ]
        interval: 2s
        timeout: 2s
        retries: 30
    "{{ .State.serviceName }}-create":
      image: {dockerfile: workloads/database-manager/Dockerfile}
      depends_on:
        "{{ .State.serviceName }}":
          condition: service_healthy
      environment:
        POSTGRES_HOST: "{{ .State.serviceName }}"
        POSTGRES_ADMIN_USER: "${POSTGRES_ADMIN_USER:-postgres}"
        POSTGRES_ADMIN_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:-password}"
      entrypoint: >-
        uv run --no-sync python -m src.main --op create --name {{ .State.dbName }}
        --owner-password ${DATABASE_OWNER_PASSWORD:-password}
        --api-user-password ${DATABASE_API_USER_PASSWORD:-password}
        --auth-user-password ${DATABASE_AUTH_USER_PASSWORD:-password}
        --orchestration-user-password ${DATABASE_ORCHESTRATION_USER_PASSWORD:-password}
    "{{ .State.serviceName }}-migrate":
      image: {dockerfile: workloads/database-migrator/Dockerfile}
      depends_on:
        "{{ .State.serviceName }}-create":
          condition: service_completed_successfully
      environment:
        DB_HOST: "{{ .State.serviceName }}"
        DB_PORT: "5432"
        DB_NAME: "{{ .State.dbName }}"
        DB_USER: "{{ .State.dbName }}_owner"
        DB_PASSWORD: "${DATABASE_OWNER_PASSWORD:-password}"
        DATABASE_SCHEMA_DIR: database
        ALLOWED_HAZARDS: HAS_UNTRACKABLE_DEPENDENCIES
