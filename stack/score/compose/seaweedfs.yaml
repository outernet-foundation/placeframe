# Compose twin of k8s/seaweedfs.yaml
- uri: template://placeframe/seaweedfs
  # Declares s3 ahead of the built-in provisioner on the first-match policy
  type: s3
  description: Placeframe SeaweedFS at fixed names with the real buckets, credentials from .env.
  outputs:
    endpoint: http://seaweedfs:8333
    access_key_id: ${S3_ACCESS_KEY:-admin}
    secret_key: ${S3_SECRET_KEY:-password}
    bucket: reconstructions
    captures_bucket: captures
  volumes:
    seaweedfs-data:
      driver: local
  services:
    seaweedfs:
      image: {dockerfile: workloads/seaweedfs/Dockerfile}
      entrypoint: /usr/local/bin/entrypoint-wrapper.sh
      command: >
        server -filer -s3 -s3.port=8333
        -s3.config=/etc/seaweedfs/s3.json
        -s3.auditLogConfig=/etc/seaweedfs/fluent.json
      environment:
        S3_ACCESS_KEY: "${S3_ACCESS_KEY:-admin}"
        S3_SECRET_KEY: "${S3_SECRET_KEY:-password}"
      volumes:
      - type: volume
        source: seaweedfs-data
        target: /data
      healthcheck:
        # Probe master and S3 both because weed binds its listeners staggered
        test:
          [
            "CMD-SHELL",
            "curl -fsS http://127.0.0.1:9333/cluster/status && curl -s -o /dev/null http://127.0.0.1:8333/",
          ]
        interval: 1s
        retries: 60
        start_period: 90s
    # The relay exists because weed has no stdout mode for the audit log
    seaweedfs-audit:
      image: {lock: SEAWEEDFS_AUDIT_IMAGE}
      depends_on:
        seaweedfs:
          condition: service_healthy
      command: ["-i", "forward", "-p", "listen=0.0.0.0", "-p", "port=24224", "-o", "stdout", "-m", "*"]
    # Pass an explicit gRPC port because the default derivation overflows 16 bits at 59002
    seaweedfs-admin:
      image: {dockerfile: workloads/seaweedfs/Dockerfile}
      entrypoint: /usr/local/bin/entrypoint-wrapper.sh
      depends_on:
        seaweedfs:
          condition: service_healthy
      command: admin -ip=0.0.0.0 -port=59001 -port.grpc=59002 -master=seaweedfs:9333 -adminPassword="${S3_SECRET_KEY:-password}"
    initialize-s3:
      image: {dockerfile: workloads/s3-initializer/Dockerfile}
      depends_on:
        seaweedfs:
          condition: service_healthy
      environment:
        S3_ENDPOINT_URL: "http://seaweedfs:8333"
        S3_ACCESS_KEY: "${S3_ACCESS_KEY:-admin}"
        S3_SECRET_KEY: "${S3_SECRET_KEY:-password}"
        S3_BUCKETS: "captures reconstructions loki"
