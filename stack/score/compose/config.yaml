# Compose twin of k8s/config.yaml
- uri: template://placeframe/config
  type: placeframe-config
  description: App config resolved from .env at run time, soft passthroughs for the auth block.
  outputs:
    public_url: ${PUBLIC_URL:?err}
    auth_audience: ${AUTH_AUDIENCE:-}
    auth_issuer_url: ${AUTH_ISSUER_URL:-}
    auth_jwks_url: ${AUTH_JWKS_URL:-}
    auth_authorization_endpoint: ${AUTH_AUTHORIZATION_ENDPOINT:-}
    auth_token_endpoint: ${AUTH_TOKEN_ENDPOINT:-}
    deployment_environment: ${DEPLOYMENT_ENVIRONMENT:-development}
    gpu_contended: ${GPU_CONTENDED:-true}
    gpu_idle_window_s: ${GPU_IDLE_WINDOW_S:-600}
    gpu_poll_interval_s: ${GPU_POLL_INTERVAL_S:-15}
    gpu_retry_after_seconds: ${GPU_RETRY_AFTER_SECONDS:-60}
    compose_project: ${COMPOSE_PROJECT_NAME:-}
