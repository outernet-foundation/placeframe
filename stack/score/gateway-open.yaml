apiVersion: score.dev/v1b1
metadata:
  name: gateway
  annotations:
    outernet.internal/publish: ${GATEWAY_PORT:-8443}/8443
containers:
  gateway:
    image: ghcr.io/outernet-foundation/placeframe/gateway:${GATEWAY_SHA}
    variables:
      PUBLIC_URL: ${resources.config.public_url}
    # The anonymous edge: gateway-keycloak.yaml minus the auth surface — no auth
    # snippet files, no AUTH_REALM, no oidc-issuer resource (the file pair *is* the
    # auth-mode difference between the two gateway artifacts; the entrypoint's
    # snippet globs simply match nothing here).
service:
  ports:
    gateway:
      port: 8443
      targetPort: 8443
resources:
  config:
    type: placeframe-config
    id: placeframe-config
