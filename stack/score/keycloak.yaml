apiVersion: score.dev/v1b1
metadata:
  name: keycloak
  annotations:
    boatyard/probe-adapter: bash-http
boatyard:
  # Strip the claimed prefix because keycloak serves at root
  # This claim is the repo's only authored /auth spelling
  route:
    path: /auth/*
    port: http
    strip: true
  # Bake the digest at generation because a runtime slot would demand the lock entry from every consumer
  lock:
    keycloak: KEYCLOAK_IMAGE
# The mgmt listener is internal because only its own probes use it
listeners:
  http: 8080
  mgmt:
    port: 9000
    internal: true
containers:
  keycloak:
    # Pass flags as args so the image's own kc.sh entrypoint stands
    args: ["start-dev", "--health-enabled=true"]
    variables:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${resources.auth.admin_password}
      KC_HOSTNAME: ${resources.auth.hostname}
      KC_HOSTNAME_ADMIN: ${resources.auth.hostname}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_STRICT_HTTPS: "true"
    livenessProbe:
      httpGet:
        path: /health/live
        port: mgmt
    readinessProbe:
      httpGet:
        path: /health/ready
        port: mgmt
resources:
  auth:
    type: oidc-issuer
    id: placeframe-keycloak
