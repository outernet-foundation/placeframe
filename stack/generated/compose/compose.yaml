name: placeframe
services:
  api-api:
    annotations:
      compose.score.dev/workload-name: api
    depends_on:
      wait-for-resources:
        condition: service_completed_successfully
        required: true
    environment:
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?err}
      AUTH_CERTS_URL: http://keycloak:8080/realms/placeframe-dev/protocol/openid-connect/certs
      AUTH_ISSUER_URL: ${PUBLIC_URL:?err}/auth/realms/placeframe-dev
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      AUTH_TOKEN_URL: ${PUBLIC_URL:?err}/auth/realms/placeframe-dev/protocol/openid-connect/token
      AUTH_URL: ${PUBLIC_URL:?err}/auth/realms/placeframe-dev/protocol/openid-connect/auth
      DATABASE_API_USER: placeframe_api_user
      DATABASE_API_USER_PASSWORD: ${DATABASE_API_USER_PASSWORD:?err}
      DATABASE_AUTH_USER: placeframe_auth_user
      DATABASE_AUTH_USER_PASSWORD: ${DATABASE_AUTH_USER_PASSWORD:?err}
      DATABASE_NAME: placeframe
      DATABASE_ORCHESTRATION_USER: placeframe_orchestration_user
      DATABASE_ORCHESTRATION_USER_PASSWORD: ${DATABASE_ORCHESTRATION_USER_PASSWORD:?err}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-development}
      LOCALIZER_CONTAINER_URL: http://localhost:8000
      LOKI_URL: http://localhost:3100
      POSTGRES_HOST: pf-postgres
      PUBLIC_URL: ${PUBLIC_URL:?err}
      RECONSTRUCTIONS_BUCKET: dev-reconstructions
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?err}
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_SECRET_KEY: ${S3_SECRET_KEY:?err}
    hostname: api
    image: ghcr.io/outernet-foundation/placeframe/api:tree-35ba0e139f65717c5e3dfbac92949defc4cb2dfc
    ports:
      - target: 8000
        published: "8000"
    restart: unless-stopped
  gateway-gateway:
    annotations:
      compose.score.dev/workload-name: gateway
    depends_on:
      wait-for-resources:
        condition: service_completed_successfully
        required: true
    environment:
      AUTH_MODE: ${AUTH_MODE:-keycloak}
      PUBLIC_URL: ${PUBLIC_URL:?err}
    hostname: gateway
    image: ghcr.io/outernet-foundation/placeframe/gateway:tree-4714e22b2bbd09351eef51bfe3b3c24bf483a33b
    ports:
      - target: 8443
        published: "8443"
  keycloak:
    command:
      - start-dev
      - --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    image: ghcr.io/outernet-foundation/mirror/quay.io/keycloak/keycloak:26.3.5@sha256:357829ec7c4693397533035092ad13b0644bcc95ded311f33a3738c4d9e9bdba
  lease-server-lease-server:
    annotations:
      compose.score.dev/workload-name: lease-server
    depends_on:
      wait-for-resources:
        condition: service_completed_successfully
        required: true
    environment:
      DATABASE_NAME: placeframe
      DATABASE_ORCHESTRATION_USER: placeframe_orchestration_user
      DATABASE_ORCHESTRATION_USER_PASSWORD: ${DATABASE_ORCHESTRATION_USER_PASSWORD:?err}
      DEPLOYMENT_ENVIRONMENT: development
      POSTGRES_HOST: pf-postgres
    hostname: lease-server
    image: ghcr.io/outernet-foundation/placeframe/lease-server:tree-c19874616f3264dcdc155617be3fb73de6c94e5a
  pf-postgres:
    entrypoint:
      - /usr/local/bin/entrypoint-wrapper.sh
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?err}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?err}
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - ${POSTGRES_ADMIN_USER:?err}
      timeout: 2s
      interval: 2s
      retries: 30
    image: ghcr.io/outernet-foundation/placeframe/postgres:tree-a725eaecbe5687560986ed32b2768c46e8e8e98f
    restart: always
    volumes:
      - type: volume
        source: pf-postgres-data
        target: /var/lib/postgresql/data
  pf-postgres-create:
    depends_on:
      pf-postgres:
        condition: service_healthy
        required: false
    entrypoint:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - src.main
      - --op
      - create
      - --name
      - placeframe
      - --owner-password
      - ${DATABASE_OWNER_PASSWORD:?err}
      - --api-user-password
      - ${DATABASE_API_USER_PASSWORD:?err}
      - --auth-user-password
      - ${DATABASE_AUTH_USER_PASSWORD:?err}
      - --orchestration-user-password
      - ${DATABASE_ORCHESTRATION_USER_PASSWORD:?err}
    environment:
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?err}
      POSTGRES_ADMIN_USER: ${POSTGRES_ADMIN_USER:?err}
      POSTGRES_HOST: pf-postgres
    image: ghcr.io/outernet-foundation/placeframe/database-manager:tree-bf0ab67d9b306cb0666a1b08124593b17a32f530
    restart: "no"
    volumes:
      - type: volume
        source: pf-postgres-efs
        target: /mnt/efs
  pf-postgres-migrate:
    depends_on:
      pf-postgres-create:
        condition: service_completed_successfully
        required: false
    environment:
      ALLOWED_HAZARDS: HAS_UNTRACKABLE_DEPENDENCIES
      DATABASE_SCHEMA_DIR: database
      DB_HOST: pf-postgres
      DB_NAME: placeframe
      DB_PASSWORD: ${DATABASE_OWNER_PASSWORD:?err}
      DB_PORT: "5432"
      DB_USER: placeframe_owner
    image: ghcr.io/outernet-foundation/placeframe/database-migrator:tree-82d31655502cfa8eaaaf276755b1eddefd5b9ab5
    restart: "no"
  seaweedfs:
    command:
      - server
      - -filer
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
    entrypoint:
      - /usr/local/bin/entrypoint-wrapper.sh
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?err}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?err}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9333/cluster/status && curl -s -o /dev/null http://127.0.0.1:8333/
      timeout: 2s
      interval: 2s
      retries: 45
    image: ghcr.io/outernet-foundation/placeframe/seaweedfs:tree-87d17dcc9c251802f59e5d93d33786050f586f3f
    restart: always
    volumes:
      - type: volume
        source: seaweedfs-data
        target: /data
  seaweedfs-init:
    depends_on:
      seaweedfs:
        condition: service_healthy
        required: false
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?err}
      S3_BUCKETS: dev-captures dev-reconstructions loki
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_SECRET_KEY: ${S3_SECRET_KEY:?err}
    image: ghcr.io/outernet-foundation/placeframe/s3-initializer:tree-8e88e7fc82c68a271040c4e165c3a1b674e561ce
    restart: "no"
  wait-for-resources:
    command:
      - echo
    depends_on:
      keycloak:
        condition: service_started
        required: true
      pf-postgres:
        condition: service_healthy
        required: true
      pf-postgres-create:
        condition: service_started
        required: true
      pf-postgres-migrate:
        condition: service_started
        required: true
      seaweedfs:
        condition: service_healthy
        required: true
      seaweedfs-init:
        condition: service_started
        required: true
    image: alpine
volumes:
  pf-postgres-data:
    driver: local
  pf-postgres-efs:
    driver: local
  seaweedfs-data:
    driver: local
