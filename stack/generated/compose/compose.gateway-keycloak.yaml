name: placeframe
services:
  gateway:
    annotations:
      compose.score.dev/workload-name: gateway
      outernet.internal/publish: ${GATEWAY_PORT:-8443}/8443
    depends_on:
      wait-for-resources:
        condition: service_completed_successfully
        required: true
    environment:
      AUTH_REALM: placeframe-dev
      PUBLIC_URL: ${PUBLIC_URL:?err}
    hostname: gateway
    image: ghcr.io/outernet-foundation/placeframe/gateway:tree-d4a9cf7ad8d7160b425cf693bbc4d206e6936bdf
    ports:
    - target: 8443
      published: ${GATEWAY_PORT:-8443}
    configs:
    - source: gateway-files-auth-loki.conf
      target: /etc/caddy/snippets/loki/auth-loki.conf
    - source: gateway-files-auth-site.conf
      target: /etc/caddy/snippets/site/auth-site.conf
  keycloak:
    command:
    - start-dev
    - --health-enabled=true
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?err}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: ${PUBLIC_URL:?err}/auth
      KC_HOSTNAME_ADMIN: ${PUBLIC_URL:?err}/auth
      KC_HOSTNAME_STRICT_HTTPS: 'true'
      KC_PROXY_HEADERS: xforwarded
    healthcheck:
      test:
      - CMD
      - /bin/bash
      - -c
      - 'exec 3<>/dev/tcp/127.0.0.1/9000; echo -e ''GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n'' >&3; cat <&3 | grep -q ''200 OK'''
      timeout: 5s
      interval: 10s
      retries: 20
      start_period: 30s
    image: ${KEYCLOAK_IMAGE:?err}
  keycloak-configurator:
    depends_on:
      keycloak:
        condition: service_healthy
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?err}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KEYCLOAK_ACCESS_TOKEN_LIFESPAN: ${KEYCLOAK_ACCESS_TOKEN_LIFESPAN:?err}
      KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT: ${KEYCLOAK_SSO_SESSION_IDLE_TIMEOUT:?err}
      KEYCLOAK_SSO_SESSION_MAX_LIFESPAN: ${KEYCLOAK_SSO_SESSION_MAX_LIFESPAN:?err}
      KEYCLOAK_URL: http://keycloak:8080
      PUBLIC_URL: ${PUBLIC_URL:?err}
      SEED_TEST_USERS: ${SEED_TEST_USERS:-}
    image: ghcr.io/outernet-foundation/placeframe/auth-initializer:tree-eb404c12f567bbfbe47acac6671afc097be7c346
  wait-for-resources:
    command:
    - echo
    depends_on:
      keycloak:
        condition: service_healthy
        required: true
      keycloak-configurator:
        condition: service_started
        required: true
    image: ${ALPINE_IMAGE:?err}
configs:
  gateway-files-auth-loki.conf:
    content: |
      forward_auth keycloak:8080 {
          uri /realms/{$$AUTH_REALM}/protocol/openid-connect/userinfo
      }
  gateway-files-auth-site.conf:
    content: |
      handle_path /auth/* {
          reverse_proxy keycloak:8080 {
              header_up X-Forwarded-Proto {$$FORWARDED_PROTO}
              header_up X-Forwarded-Port {$$FORWARDED_PORT}
          }
      }
