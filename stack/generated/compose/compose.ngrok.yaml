name: placeframe
services:
  ngrok:
    annotations:
      compose.score.dev/workload-name: ngrok
      outernet.internal/restart: on-failure
    entrypoint:
    - /bin/sh
    - -c
    - exec ngrok http --domain=$${NGROK_DOMAIN:-} --upstream-protocol=http1 --log=stdout http://door:8443
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    hostname: ngrok
    image: ghcr.io/outernet-foundation/mirror/docker.io/ngrok/ngrok:alpine@sha256:a51a7637a70be573615b01852af0419c4ab9dc857601b3d61ea2a082be3ec0d3
    restart: on-failure
