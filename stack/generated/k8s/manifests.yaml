data:
  config.yaml: |
    
    auth_enabled: false
    common:
      path_prefix: /loki
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
        replication_factor: 1
    ingester:
      lifecycler:
        ring:
          replication_factor: 1
      max_chunk_age: 720h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 720h
      retention_period: 720h
    schema_config:
      configs:
      - from: "2024-01-01"
        index:
          period: 24h
          prefix: index_
        object_store: s3
        schema: v13
        store: tsdb
    server:
      http_listen_port: 3100
    storage_config:
      aws:
        access_key_id: ${S3_ACCESS_KEY}
        bucketnames: loki
        endpoint: seaweedfs:8333
        insecure: true
        s3forcepathstyle: true
        secret_access_key: ${S3_SECRET_KEY}
