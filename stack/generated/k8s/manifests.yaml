      initContainers:
        - image: ghcr.io/outernet-foundation/placeframe/auth-initializer:tree-e53ec750921b2d87314c4a01836007133855bb4e
          name: auth-initializer
          volumeMounts:
            - mountPath: /keycloak_import
              name: import
            - mountPath: /auth_data
              name: auth-data
      securityContext:
        fsGroup: 1000
      volumes:
        - emptyDir: {}
