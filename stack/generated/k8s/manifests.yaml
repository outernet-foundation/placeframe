apiVersion: batch/v1
kind: Job
metadata:
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  name: pf-postgres-create
spec:
  backoffLimit: 30
  template:
    spec:
      containers:
        - command:
            - uv
            - run
            - --no-sync
            - python
            - -m
            - src.main
            - --op
            - create
            - --name
            - placeframe
            - --owner-password
            - $(DATABASE_OWNER_PASSWORD)
            - --api-user-password
            - $(DATABASE_API_USER_PASSWORD)
            - --auth-user-password
            - $(DATABASE_AUTH_USER_PASSWORD)
            - --orchestration-user-password
            - $(DATABASE_ORCHESTRATION_USER_PASSWORD)
          env:
            - name: POSTGRES_HOST
              value: pf-postgres
            - name: POSTGRES_ADMIN_USER
              value: postgres
            - name: POSTGRES_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_ADMIN_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_OWNER_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_API_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_API_USER_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_AUTH_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_AUTH_USER_PASSWORD
                  name: placeframe-secrets
            - name: DATABASE_ORCHESTRATION_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: DATABASE_ORCHESTRATION_USER_PASSWORD
                  name: placeframe-secrets
          image: ghcr.io/outernet-foundation/placeframe/database-manager:tree-62881ea05f99c50d40b05660448aef8c89a0394a
          name: create
          volumeMounts:
            - mountPath: /mnt/efs
              name: efs
      restartPolicy: OnFailure
      volumes:
        - emptyDir: {}
          name: efs
