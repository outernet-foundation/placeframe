apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: placeframe
  labels:
    com.docker.compose.project: placeframe
    com.docker.compose.volume: minio_data
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
