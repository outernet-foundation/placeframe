apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-logger
  namespace: placeframe
  labels:
    com.docker.compose.project: placeframe
    com.docker.compose.service: minio-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      com.docker.compose.project: placeframe
      com.docker.compose.service: minio-logger
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        com.docker.compose.project: placeframe
        com.docker.compose.service: minio-logger
        com.docker.compose.network.default: 'true'
    spec:
      enableServiceLinks: false
      initContainers:
      - name: wait-for-minio
        image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - sh
        - -c
        - until nc -z -w 2 minio 9001; do echo 'waiting for minio'; sleep 2; done
      containers:
      - name: minio-logger
        image: docker.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - set -e; mc alias set local http://minio:9000 'admin' 'password'; mc admin trace --verbose --all local
        env:
        - name: MINIO_ACCESS_KEY
          value: admin
        - name: MINIO_SECRET_KEY
          value: password
