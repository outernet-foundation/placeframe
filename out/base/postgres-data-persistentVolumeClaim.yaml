apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: placeframe
  labels:
    com.docker.compose.project: placeframe
    com.docker.compose.volume: postgres_data
spec:
  accessModes:
  - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 10Gi
