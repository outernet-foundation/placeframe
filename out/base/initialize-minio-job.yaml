apiVersion: batch/v1
kind: Job
metadata:
  name: initialize-minio
  namespace: placeframe
  labels:
    com.docker.compose.project: placeframe
    com.docker.compose.service: initialize-minio
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        com.docker.compose.project: placeframe
        com.docker.compose.service: initialize-minio
        com.docker.compose.network.default: 'true'
    spec:
      enableServiceLinks: false
      restartPolicy: Never
      initContainers:
      - name: wait-for-minio
        image: docker.io/library/busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command:
        - sh
        - -c
        - until nc -z -w 2 minio 9001; do echo 'waiting for minio'; sleep 2; done
      containers:
      - name: initialize-minio
        image: docker.io/minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - mc alias set local http://minio:9000 'admin' 'password' && mc mb --ignore-existing local/dev-captures && mc mb --ignore-existing local/dev-reconstructions && mc mb --ignore-existing local/loki
        env:
        - name: MINIO_ACCESS_KEY
          value: admin
        - name: MINIO_SECRET_KEY
          value: password
