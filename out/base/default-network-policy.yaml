apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-network-policy
  namespace: placeframe
spec:
  podSelector:
    matchLabels:
      com.docker.compose.network.default: 'true'
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          com.docker.compose.network.default: 'true'
