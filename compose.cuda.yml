services:
  reconstructor-cuda:
    image: "ghcr.io/outernet-foundation/placeframe/reconstructor-cuda:${RECONSTRUCTOR_SHA:?err}"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    expose:
      - "5678"
    volumes:
      - auth_data:/run/secrets:ro
    gpus: all
    environment:
      API_INTERNAL_URL: http://api:8000
      AUTH_TOKEN_URL: "https://${PUBLIC_DOMAIN:?err}/auth/realms/placeframe-dev/protocol/openid-connect/token"
      AUTH_CLIENT_ID: "${AUTH_WORKER_CLIENT_ID:?err}"
      PRIVATE_KEY_PATH: /run/secrets/worker-private-key.pem
      MINIO_ENDPOINT_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?err}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?err}"
      RECONSTRUCTIONS_BUCKET: dev-reconstructions
      CAPTURES_BUCKET: dev-captures

  localizer-cuda:
    image: "ghcr.io/outernet-foundation/placeframe/localizer-cuda:${LOCALIZER_SHA:?err}"
    expose:
      - "8000"
    networks:
      default:
        aliases: [ "localizer" ]
    gpus: all
    configs:
      - source: localizer-calibration-global
        target: /etc/placeframe/calibration/global.json
        mode: 0444
    environment:
      MINIO_ENDPOINT_URL: "http://minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:?err}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:?err}"
      RECONSTRUCTIONS_BUCKET: dev-reconstructions
