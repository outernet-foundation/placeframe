services:
  reconstructor-cuda:
    image: "ghcr.io/outernet-foundation/placeframe/reconstructor-cuda:${RECONSTRUCTOR_SHA:?err}"
    depends_on:
      lease-server:
        condition: service_healthy
    restart: on-failure
    expose:
      - "5678"
    gpus: all
    environment:
      LEASE_SERVER_URL: http://lease-server:8000
      S3_ENDPOINT_URL: "http://seaweedfs:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?err}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?err}"
      RECONSTRUCTIONS_BUCKET: dev-reconstructions
      CAPTURES_BUCKET: dev-captures
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"
      SERVICE_VERSION: "${RECONSTRUCTOR_SHA:?err}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"

  localizer-cuda:
    image: "ghcr.io/outernet-foundation/placeframe/localizer-cuda:${LOCALIZER_SHA:?err}"
    expose:
      - "8000"
    networks:
      default:
        aliases: [ "localizer" ]
    gpus: all
    environment:
      S3_ENDPOINT_URL: "http://seaweedfs:8333"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:?err}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:?err}"
      RECONSTRUCTIONS_BUCKET: dev-reconstructions
      DEPLOYMENT_ENVIRONMENT: "${DEPLOYMENT_ENVIRONMENT:-development}"
      SERVICE_VERSION: "${LOCALIZER_SHA:?err}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy:4317"
