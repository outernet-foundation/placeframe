[project]
name = "placeframe"
version = "0.0.1"
requires-python = ">=3.13"
dependencies = []


[dependency-groups]
dev = ["build-scripts", "scripts", "basedpyright>=1.39.10", "deptry>=0.24.0", "ruff>=0.14.11", "pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.uv.workspace]
members = [
    "docker/aoa-bridge",
    "docker/database-manager",
    "docker/s3-initializer",
    "docker/api",
    "docker/auth-initializer",
    "docker/lease-server",
    "docker/localizer",
    "docker/orchestrator",
    "docker/rathole-client",
    "docker/reconstructor",
    "docker/zed-capture",
    "packages/python/core",
    "packages/python/common",
    "packages/python/neural-networks",
    "packages/python/neural-networks/third-party/deep-image-retrieval",
    "packages/generated/python/datamodels",
    "packages/generated/python/api-client",
    "packages/generated/python/lease-server-client",
    "packages/generated/python/localizer-client",
    "build",
    "scripts",
]


[tool.uv]
required-version = "==0.12.15"
config-settings-package.placeframe-api-client = { editable_mode = "compat" }
config-settings-package.placeframe-lease-server-client = { editable_mode = "compat" }
config-settings-package.placeframe-localizer-client = { editable_mode = "compat" }

[tool.uv.sources]
placeframe-common = { workspace = true }
placeframe-core = { workspace = true }
neural-networks = { workspace = true }
datamodels = { workspace = true }
placeframe-lease-server-client = { workspace = true }
placeframe-localizer-client = { workspace = true }
placeframe_api_client = { workspace = true }
dirtorch = { workspace = true }
build-scripts = { workspace = true }
scripts = { workspace = true }
lightglue = { git = "https://github.com/cvg/LightGlue.git" }
bashrun = { git = "https://github.com/outernet-foundation/bashrun.git", rev = "1a0add1eb9e53e19245dcdda3e2018577b4e1153" }
logconf = { git = "https://github.com/outernet-foundation/logconf.git", rev = "3a8216eb39008e5769b71f98e65bffc60cd01f0a" }
stack-lifecycle = { git = "https://github.com/outernet-foundation/stack-lifecycle.git", rev = "8132ab66d6c6e8342d299fc4e76c8f9fe93ea2c1" }
unity-buildkit = { git = "https://github.com/outernet-foundation/unity-buildkit.git", rev = "70741126846015e001952d4465b7512c75643b2f" }
openapi-clientgen = { git = "https://github.com/outernet-foundation/openapi-clientgen.git", rev = "938bdf2a8b86263f65619681ab292cb3109386c8" }
pubpkg = { git = "https://github.com/outernet-foundation/pubpkg.git", rev = "b2c226c232ccfe2b81283932b2308327fdf500dc" }

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
include = [
    "build/**/src/**/*.py",
    "build/**/src/**/*.pyi",
    "docker/zed-capture/**/src/**/*.py",
    "docker/zed-capture/**/src/**/*.pyi",
    "docker/**/src/**/*.py",
    "docker/**/src/**/*.pyi",
    "packages/**/src/**/*.py",
    "packages/**/src/**/*.pyi",
    "scripts/**/src/**/*.py",
    "scripts/**/src/**/*.pyi",
]

[tool.pytest.ini_options]
testpaths = ["build/tests", "packages/python/common/tests", "scripts/tests", "docker/s3-initializer/tests"]
