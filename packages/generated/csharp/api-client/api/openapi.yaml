    ReconstructionOptions:
      example:
        ransac_max_error: 1.0246457001441578
        pair_pose_graph_min_baseline_m: 3.5571952270680973
        held_out_frame_timestamps:
        - 2
        - 2
        pair_pose_graph_max_rotation_disagreement_deg: 9.018348186070783
        pair_max_displacement_drift_rate_m_per_s: 3.616076749251911
        pair_min_match_spread: 2.027123023002322
        bundle_adjustment_global_function_tolerance: 9.369310271410669
        retrieval_min_score: 4.145608029883936
        retrieval_min_num_inliers: 1
        retrieval_neighbors: 2
        max_keypoints_per_image: 1
        mapper_filter_max_reprojection_error: 5.025004791520295
        triangulation_minimum_angle: 4.965218492984954
        bundle_adjustment_global_frames_ratio: 9.965781217890562
        retrieval_min_distance_m: 7.061401241503109
        two_view_min_num_inliers: 6
        spatial_max_distance_m: 5.637376656633329
        retrieval_min_inlier_ratio: 7.457744773683766
        retrieval_covisibility_min_support: 1
        vio_check_max_disagreement_m: 8.762042012749001
        spatial_neighbors: 5
        pair_max_displacement_scene_m: 9.301444243932576
        ransac_min_inlier_ratio: 1.4894159098541704
        pair_pose_graph_min_registered_frames: 6
        pose_prior_position_sigma_m: 6.683562403749608
        sequential_window: 1
        pair_pose_graph_max_translation_direction_deg: 6.438423552598547
        deterministic_seed: 0
        retrieval_covisibility_window: 7
        keyframe_min_distance_m: 6.027456183070403
      properties:
        deterministic_seed:
          description: PRNG seed and single-threaded gate for reproducible reconstructions;
            None means non-deterministic.
          nullable: true
          type: integer
        keyframe_min_distance_m:
          default: 0.2
          description: Minimum VIO-translation distance (meters) between successive
            kept keyframes; frames closer to the last kept frame than this are dropped
            before feature extraction.
          format: double
          type: number
        sequential_window:
          default: 10
          description: Per-frame count of temporally-adjacent neighbours (each side)
            paired within a rig for the temporal match-graph backbone.
          type: integer
        spatial_neighbors:
          default: 0
          description: "Top-K closest in-range neighbours by VIO-position paired with\
            \ each frame; 0 disables spatial pairing. Adjacent frames already covered\
            \ by sequential pairing are deduped at union time. Disabled by default:\
            \ VIO-near pairs that are also visually-aliased can poison the early model,\
            \ and sequential pairing already covers the temporal-local backbone while\
            \ retrieval handles loop closure under the two-phase ingest. Re-enable\
            \ for VIO-quiet captures where neither sequential nor retrieval can reach\
            \ a frame's true neighbours."
          type: integer
        spatial_max_distance_m:
          default: 6.0
          description: Maximum VIO-position distance (meters) for spatial pairs; in-range
            neighbours are then capped at spatial_neighbors closest. No-op when positions
            are absent.
          format: double
          type: number
        retrieval_neighbors:
          default: 0
          description: Top-K most-similar images (DIR cosine) paired with each image
            for loop closures; 0 disables retrieval.
          type: integer
        retrieval_min_distance_m:
          default: 1.0
          description: Minimum VIO-position distance for retrieval pairs; drops candidates
            already covered by sequential pairing. No-op when positions are absent.
          format: double
          type: number
        pair_max_displacement_scene_m:
          default: 10.0
          description: "Max plausible scene-radius component of the displacement bound\
            \ used to reject any candidate pair (a,b) whose VIO straight-line displacement\
            \ exceeds the bound. Combined with pair_max_displacement_drift_rate_m_per_s:\
            \ a pair is rejected when |vio_pos(b)−vio_pos(a)| > pair_max_displacement_scene_m\
            \ + pair_max_displacement_drift_rate_m_per_s · |t_b−t_a|. Applied uniformly\
            \ across all pair sources; stereo and short-temporal pairs trivially satisfy\
            \ any reasonable bound. No-op when positions are absent."
          format: double
          type: number
        pair_max_displacement_drift_rate_m_per_s:
          default: 0.1
          description: VIO drift-rate slack added to the displacement bound per second
            of time gap between the two frames of a candidate pair. Lets long-temporal-gap
            true loop closures survive accumulated drift while still rejecting short-temporal-gap
            aliased pairs (e.g. retrieval matches between physically distant frames
            seconds apart). Calibrate per device class against post-hoc VIO↔recon
            residuals.
          format: double
          type: number
        pair_min_match_spread:
          default: 0.08
          description: "Minimum spread of inlier-match keypoint positions, expressed\
            \ as geometric mean of per-axis standard deviations normalized by image\
            \ dimensions, taken as the min across the two images. Pairs below the\
            \ threshold are rejected at the two-view verification stage. Catches the\
            \ repeated-decor aliasing pattern where matches concentrate on a small\
            \ set of similar features (e.g. multiple identical artworks in an office)\
            \ — both images show matches clustered in a tiny region, producing a low\
            \ spread, while true wide-baseline matches spread across the image. Independent\
            \ of VIO drift; works monocular. 0 disables the filter."
          format: double
          type: number
        retrieval_min_score:
          default: 0.35
          description: Minimum cosine similarity for retrieval candidates; drops visually-weak
            matches before BA.
          format: double
          type: number
        retrieval_covisibility_window:
          default: 3
          description: "Half-width (in temporal keyframe indices) of the neighborhood\
            \ used to validate retrieval pairs against perceptual aliasing. A pair\
            \ (A,B) is supported by another retrieval pair (A',B') iff both endpoints\
            \ fall within this window of the original pair on their respective trajectories."
          type: integer
        retrieval_covisibility_min_support:
          default: 2
          description: "Minimum count of supporting retrieval pairs within retrieval_covisibility_window\
            \ required for a retrieval candidate to be kept; aliased pairs (e.g. two\
            \ similar paintings in different rooms) appear as singletons and get dropped,\
            \ while true loop closures appear as bands and survive. 0 disables the\
            \ filter."
          type: integer
        ransac_max_error:
          default: 2.0
          description: Two-view RANSAC inlier threshold in pixels; lower is stricter.
          format: double
          type: number
        ransac_min_inlier_ratio:
          default: 0.25
          description: Two-view RANSAC minimum inlier ratio to accept a pair's geometry.
          format: double
          type: number
        two_view_min_num_inliers:
          default: 30
          description: "Absolute minimum inlier count for a verified two-view geometry,\
            \ applied alongside ransac_min_inlier_ratio. Raised above pycolmap's SIFT-era\
            \ default of 15 to reject small false-positive clusters on repetitive\
            \ structure."
          type: integer
        retrieval_min_inlier_ratio:
          default: 0.4
          description: Two-view RANSAC minimum inlier ratio for retrieval-sourced
            pairs only; stricter than the sequential/spatial/intra-frame floor because
            visually-similar-but-spatially-distant indoor regions can fabricate plausible-looking
            essential matrices.
          format: double
          type: number
        retrieval_min_num_inliers:
          default: 50
          description: Absolute minimum inlier count for retrieval-sourced pair geometries;
            stricter than the global two_view_min_num_inliers because retrieval is
            the lone pair source where visual similarity does not imply spatial proximity.
          type: integer
        triangulation_minimum_angle:
          default: 3.0
          description: Minimum triangulation angle in degrees; applied at creation
            time and again in mapper filtering.
          format: double
          type: number
        mapper_filter_max_reprojection_error:
          default: 2.0
          description: Post-BA outlier reprojection threshold in pixels; points exceeding
            it are culled.
          format: double
          type: number
        bundle_adjustment_global_frames_ratio:
          default: 1.5
          description: Frame-count growth ratio that triggers a global BA event; larger
            = fewer events.
          format: double
          type: number
        bundle_adjustment_global_function_tolerance:
          default: 0.001
          description: Ceres function tolerance for global BA exit; larger = earlier
            exit on residual plateaus.
          format: double
          type: number
        pose_prior_position_sigma_m:
          default: 0.05
          description: Standard deviation in meters for the position prior covariance;
            consumed only by monocular captures (multi-camera captures run priors-off).
          format: double
          type: number
        vio_check_max_disagreement_m:
          default: 1000000000
          description: Reject a registration when the disagreement (meters) between
            the local-Umeyama-predicted recon position and the recon position COLMAP
            just assigned exceeds this. Also used as the LO-RANSAC inlier threshold
            when fitting the local Sim3 from VIO neighbors. Disabled by default (1e9
            m is effectively infinity for any real capture); the pair-level pose-graph
            consistency check and the two-phase retrieval ingest are the primary aliasing
            defenses. Set to a finite value (e.g. 1.0) to gate registrations against
            VIO drift bounds on captures where the device-reported trajectory is trusted
            to within a metre.
          format: double
          type: number
        pair_pose_graph_max_rotation_disagreement_deg:
          default: 15.0
          description: "At per-frame registration time, compare the relative rotation\
            \ each already-registered partner's two-view geometry implies against\
            \ the relative rotation the partial reconstruction estimates between the\
            \ same frames. Partners exceeding this angular threshold are flagged poisoned\
            \ and their contributing matches are excised from the new frame's observations\
            \ before the next BA pass. Independent of VIO; uses the pose graph itself\
            \ as the consistency oracle. 0 disables."
          format: double
          type: number
        pair_pose_graph_max_translation_direction_deg:
          default: 30.0
          description: "Companion to pair_pose_graph_max_rotation_disagreement_deg:\
            \ bounds the angle between the unit translation direction the two-view\
            \ geometry implies and the unit translation direction implied by the partial\
            \ reconstruction's pose estimates of the two frames. Two-view geometry\
            \ is scale-free in the monocular case so only direction is compared. Skipped\
            \ when the estimated baseline is below pair_pose_graph_min_baseline_m.\
            \ 0 disables."
          format: double
          type: number
        pair_pose_graph_min_baseline_m:
          default: 0.3
          description: Estimated-baseline floor below which the translation-direction
            component of the pose-graph consistency check is skipped. Near-co-located
            frames have ill-defined translation direction; the rotation component
            still applies.
          format: double
          type: number
        pair_pose_graph_min_registered_frames:
          default: 15
          description: "Minimum number of registered frames in the partial reconstruction\
            \ before pair_pose_graph_* consistency checks fire. Early in the reconstruction\
            \ the pose graph is too soft to be a reliable oracle; the front-door filters\
            \ (covisibility, drift budget, vio_check) carry the load until the graph\
            \ stiffens."
          type: integer
        max_keypoints_per_image:
          default: 2500
          description: Maximum ALIKED keypoints retained per image.
          type: integer
        held_out_frame_timestamps:
          description: Frame timestamps (ms) to exclude from this reconstruction so
            they can later be localized as held-out queries.
          items:
            type: integer
          nullable: true
          type: array
      title: ReconstructionOptions
      type: object
