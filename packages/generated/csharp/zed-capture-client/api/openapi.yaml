openapi: 3.0.3
info:
  title: Zed API
  version: 0.1.0
servers:
- url: /
paths:
  /capture_sessions/start:
    post:
      deprecated: false
      operationId: start_capture
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCaptureRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                format: uuid
                type: string
          description: "Document created, URL follows"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/start_capture_400_response"
          description: Bad request syntax or unsupported method
      summary: StartCapture
      tags:
      - Default
  /capture_sessions/stop:
    post:
      deprecated: false
      operationId: stop_capture
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StopCaptureRequest"
        required: true
      responses:
        "201":
          description: "Document created, URL follows"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/start_capture_400_response"
          description: Bad request syntax or unsupported method
      summary: StopCapture
      tags:
      - Default
  /capture_sessions:
    delete:
      deprecated: false
      operationId: delete_all_capture_sessions
      responses:
        "204":
          description: "Request fulfilled, nothing follows"
      summary: DeleteAllCaptureSessions
      tags:
      - Default
    get:
      deprecated: false
      operationId: get_capture_sessions
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ZedCapture"
                type: array
          description: "Request fulfilled, document follows"
      summary: GetCaptureSessions
      tags:
      - Default
  /capture_sessions/{id}:
    delete:
      deprecated: false
      operationId: delete_capture_session
      parameters:
      - deprecated: false
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: "Request fulfilled, nothing follows"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/start_capture_400_response"
          description: Bad request syntax or unsupported method
      summary: DeleteCaptureSession
      tags:
      - Default
    patch:
      deprecated: false
      operationId: update_capture_session
      parameters:
      - deprecated: false
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCaptureSessionRequest"
        required: true
      responses:
        "200":
          description: "Request fulfilled, document follows"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/start_capture_400_response"
          description: Bad request syntax or unsupported method
      summary: UpdateCaptureSession
      tags:
      - Default
  /capture_sessions/{id}/tar:
    get:
      deprecated: false
      operationId: download_capture_session_tar
      parameters:
      - deprecated: false
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/x-tar:
              schema:
                format: binary
                type: string
          description: File Download
          headers:
            content-length:
              deprecated: false
              description: File size in bytes
              explode: false
              required: false
              schema:
                type: string
              style: simple
            last-modified:
              deprecated: false
              description: Last modified data-time in RFC 2822 format
              explode: false
              required: false
              schema:
                format: date-time
                type: string
              style: simple
            etag:
              deprecated: false
              description: Entity tag
              explode: false
              required: false
              schema:
                type: string
              style: simple
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/start_capture_400_response"
          description: Bad request syntax or unsupported method
      summary: DownloadCaptureSessionTar
      tags:
      - Default
  /status:
    get:
      deprecated: false
      operationId: get_status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZedStatus"
          description: "Request fulfilled, document follows"
      summary: GetStatus
      tags:
      - Default
components:
  schemas:
    StartCaptureRequest:
      example:
        capture_interval: 0.8008281904610115
        started_at: 2000-01-23T04:56:07.000+00:00
      properties:
        started_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        capture_interval:
          format: double
          nullable: true
          type: number
      required:
      - started_at
      title: StartCaptureRequest
      type: object
    StopCaptureRequest:
      example:
        name: name
      properties:
        name:
          type: string
      required:
      - name
      title: StopCaptureRequest
      type: object
    UpdateCaptureSessionRequest:
      example:
        name: name
      properties:
        name:
          type: string
      required:
      - name
      title: UpdateCaptureSessionRequest
      type: object
    ZedCapture:
      example:
        recorded_at: 2000-01-23T04:56:07.000+00:00
        size_bytes: 0
        name: name
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        recorded_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        size_bytes:
          format: int64
          type: integer
      required:
      - id
      - name
      - recorded_at
      - size_bytes
      title: ZedCapture
      type: object
    ZedStatus:
      example:
        disk_free_bytes: 0
        current_capture_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        stabilizing: true
        last_exception: last_exception
        uptime_s: 6.027456183070403
        version: version
        tracking_state: tracking_state
      properties:
        current_capture_id:
          format: uuid
          nullable: true
          type: string
        tracking_state:
          type: string
        stabilizing:
          type: boolean
        last_exception:
          nullable: true
          type: string
        disk_free_bytes:
          format: int64
          type: integer
        uptime_s:
          format: double
          type: number
        version:
          type: string
      required:
      - disk_free_bytes
      - stabilizing
      - tracking_state
      - uptime_s
      - version
      title: ZedStatus
      type: object
    start_capture_400_response_extra:
      additionalProperties: {}
      anyOf:
      - type: object
      - items: {}
        type: array
      nullable: true
    start_capture_400_response:
      description: Validation Exception
      example:
        status_code: 400
        detail: Bad Request
        extra: {}
      properties:
        status_code:
          type: integer
        detail:
          type: string
        extra:
          $ref: "#/components/schemas/start_capture_400_response_extra"
      required:
      - detail
      - status_code
      type: object

