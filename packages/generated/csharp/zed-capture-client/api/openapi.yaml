openapi: 3.0.3
info:
  title: Zed API
  version: 0.1.0
servers:
- url: /
paths:
  /captures/start:
    post:
      deprecated: false
      operationId: start_capture
      parameters:
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        explode: true
        in: query
        name: capture_interval
        required: false
        schema:
          format: double
          nullable: true
          type: number
        style: form
      responses:
        "201":
          content:
            application/json:
              schema:
                format: uuid
                type: string
          description: "Document created, URL follows"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/start_capture_400_response"
          description: Bad request syntax or unsupported method
      summary: StartCapture
      tags:
      - Default
  /captures/stop:
    post:
      deprecated: false
      operationId: stop_capture
      responses:
        "201":
          description: "Document created, URL follows"
      summary: StopCapture
      tags:
      - Default
  /captures:
    delete:
      deprecated: false
      operationId: delete_all_captures
      responses:
        "204":
          description: "Request fulfilled, nothing follows"
      summary: DeleteAllCaptures
      tags:
      - Default
    get:
      deprecated: false
      operationId: get_captures
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ZedCapture"
                type: array
          description: "Request fulfilled, document follows"
      summary: GetCaptures
      tags:
      - Default
  /captures/{id}:
    delete:
      deprecated: false
      operationId: delete_capture
      parameters:
      - deprecated: false
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: "Request fulfilled, nothing follows"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/start_capture_400_response"
          description: Bad request syntax or unsupported method
      summary: DeleteCapture
      tags:
      - Default
    get:
      deprecated: false
      operationId: download_capture_tar
      parameters:
      - deprecated: false
        explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - allowEmptyValue: false
        allowReserved: false
        deprecated: false
        explode: true
        in: query
        name: include_svo
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/x-tar:
              schema:
                format: binary
                type: string
          description: Stream Response
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/start_capture_400_response"
          description: Bad request syntax or unsupported method
      summary: DownloadCaptureTar
      tags:
      - Default
  /status:
    get:
      deprecated: false
      operationId: get_status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZedStatus"
          description: "Request fulfilled, document follows"
      summary: GetStatus
      tags:
      - Default
components:
  schemas:
    ZedCapture:
      example:
        recorded_at: 2000-01-23T04:56:07.000+00:00
        size_bytes: 0
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        id:
          format: uuid
          type: string
        recorded_at:
          description: datetime with the constraint that the value must have timezone
            info
          format: date-time
          type: string
        size_bytes:
          format: int64
          type: integer
      required:
      - id
      - recorded_at
      - size_bytes
      title: ZedCapture
      type: object
    ZedStatus:
      example:
        disk_free_bytes: 0
        current_capture_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        last_exception: last_exception
        uptime_s: 6.027456183070403
        version: version
      properties:
        current_capture_id:
          format: uuid
          nullable: true
          type: string
        last_exception:
          nullable: true
          type: string
        disk_free_bytes:
          format: int64
          type: integer
        uptime_s:
          format: double
          type: number
        version:
          type: string
      required:
      - disk_free_bytes
      - uptime_s
      - version
      title: ZedStatus
      type: object
    start_capture_400_response_extra:
      additionalProperties: {}
      anyOf:
      - type: object
      - items: {}
        type: array
      nullable: true
    start_capture_400_response:
      description: Validation Exception
      example:
        status_code: 400
        detail: Bad Request
        extra: {}
      properties:
        status_code:
          type: integer
        detail:
          type: string
        extra:
          $ref: "#/components/schemas/start_capture_400_response_extra"
      required:
      - detail
      - status_code
      type: object

