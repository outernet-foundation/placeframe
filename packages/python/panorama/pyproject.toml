[project]
name = "panorama"
version = "0.1.0"
description = "Spherical (equirectangular) capture support: view layouts, projection, and video inspection"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.4.0",
]

# Decoding a video needs OpenCV, which the reconstructor does not: it is handed
# already-extracted frames. Keeping the decoder behind an extra lets that service
# depend on this package for the projection maths alone.
[project.optional-dependencies]
video = ["opencv-python-headless>=4.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panorama"]
include = ["src/panorama/py.typed"]
