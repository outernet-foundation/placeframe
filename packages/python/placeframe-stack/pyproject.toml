[project]
name = "placeframe-stack"
version = "0.1.0"
description = "Docker-stack lifecycle commands (up/down/build) and their helpers"
requires-python = ">=3.13"
dependencies = [
  "placeframe-bash",
  "pydantic-settings>=2.9.1",
  "typer>=0.17.4",
  "pyyaml>=6.0",
  "pathspec>=1.0.4",
]

[tool.deptry]
known_first_party = ["placeframe_stack"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placeframe_stack"]
force-include = { "src/placeframe_stack/py.typed" = "placeframe_stack/py.typed" }

[project.scripts]
up = "placeframe_stack.up:app"
down = "placeframe_stack.down:app"
build = "placeframe_stack.build_docker:app"
score-up = "placeframe_stack.score_up:app"
score-down = "placeframe_stack.score_down:app"
pf-secrets = "placeframe_stack.secrets_exec:app"
