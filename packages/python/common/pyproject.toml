[project]
name = "common"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.39.5",
    "litestar>=2.19.0",
    "pydantic>=2.12.5",
    "botocore>=1.42.24",
    "python-json-logger>=3.2.0",
]

[dependency-groups]
dev = ["boto3-stubs[batch,ecs,secretsmanager,s3,lambda]>=1.40.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common"]
force-include = { "src/common/py.typed" = "common/py.typed" }

[tool.deptry.per_rule_ignores]
# python-json-logger is loaded by logging.config.dictConfig via the
# string "pythonjsonlogger.json.JsonFormatter", not imported directly.
DEP002 = ["python-json-logger"]
