[project]
name = "placeframe-unity"
version = "0.1.0"
description = "Unity project discovery, build, license, and CI tooling"
requires-python = ">=3.13"
dependencies = [
    "placeframe-bash",
    "typer>=0.17.4",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
]

[project.scripts]
activate-unity-license = "placeframe_unity.license:activate_app"
build-unity = "placeframe_unity.build_unity:app"
compile-unity = "placeframe_unity.compile_unity:app"
install = "placeframe_unity.install:app"
lock-unity = "placeframe_unity.lock_unity:app"
test-unity = "placeframe_unity.test_unity:app"
unity-license-tag = "placeframe_unity.license_restore:tag_app"
unity-matrix = "placeframe_unity.matrix:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/placeframe_unity"]
force-include = { "src/placeframe_unity/py.typed" = "placeframe_unity/py.typed" }
