name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Override: use this CI run ID instead of looking up by SHA"
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLACEFRAME_CI_APP_ID }}
          private-key: ${{ secrets.PLACEFRAME_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      # Workaround: fetch-tags is broken with shallow clones
      - run: git fetch --tags origin

      - uses: ./.github/actions/setup-uv

      - name: Fetch CI artifacts
        id: fetch-ci-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync fetch-ci-artifacts ${{ inputs.ci-run-id && format('--ci-run-id {0}', inputs.ci-run-id) || '' }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run --no-sync publish-packages

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run --no-sync create-release
