name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@ccf766ac23b4ce7fbc54a8f6d1659d8a9ae1b135
    with:
      pr-number: ${{ github.event.pull_request.number }}
