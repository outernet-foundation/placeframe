name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@33846e0ba25689e375982f3319716b90109b47fc
    with:
      pr-number: ${{ github.event.pull_request.number }}
