name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@f2d576acbceeca8afb324152aad8e4928d5a769b
    with:
      pr-number: ${{ github.event.pull_request.number }}
