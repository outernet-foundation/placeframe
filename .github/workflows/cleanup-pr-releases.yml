name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@dc3659d1d57b6765dd4eeffaae288e8566985267
    with:
      pr-number: ${{ github.event.pull_request.number }}
