name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@af9f109105f6c16a0da12b1679fe330967d6ce8a
    with:
      pr-number: ${{ github.event.pull_request.number }}
