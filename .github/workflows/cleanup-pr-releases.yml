name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@91f416fbddce3d4346b47cfec174a4b4533f9859
    with:
      pr-number: ${{ github.event.pull_request.number }}
