name: Cleanup PR releases

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-pr-releases:
    if: github.event.pull_request.merged == false
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/cleanup-pr-releases.yml@da9052438c358d9024ac60da50e58e9697f36288
    with:
      pr-number: ${{ github.event.pull_request.number }}
