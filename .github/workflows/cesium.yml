name: Cesium

on:
  workflow_dispatch:
    inputs:
      build-number:
        description: "Build number — bump to force full rebuild and new package version"
        default: "19"

env:
  CESIUM_VERSION: "1.15.3"
  BUILD_NUMBER: "${{ inputs.build-number }}"
  CACHE_REGISTRY: "ghcr.io/${{ github.repository }}/cache"

jobs:
  activate-license:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    container:
      image: unityci/editor:2022.3.42f1-linux-il2cpp-3
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /usr/share/dotnet:/to_clean/dotnet
        - /usr/local/.ghcup:/to_clean/ghcup
        - /usr/share/swift:/to_clean/swift
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv

      - name: Activate Unity license
        run: uv run --no-sync activate-unity-license --oras-push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}

  codegen:
    needs: [activate-license]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: editor
            platform: linux
            module: linux-il2cpp
          - mode: editor
            platform: windows
            module: windows-mono
          - mode: standalone
            platform: linux
            module: linux-il2cpp
          - mode: standalone
            platform: windows
            module: windows-mono
          - mode: standalone
            platform: android
            module: android
    name: codegen (${{ matrix.mode }}-${{ matrix.platform }})
    container:
      image: unityci/editor:2022.3.42f1-${{ matrix.module }}-3
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /usr/share/dotnet:/to_clean/dotnet
        - /usr/local/.ghcup:/to_clean/ghcup
        - /usr/share/swift:/to_clean/swift
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv

      - name: Codegen
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync codegen-cesium \
            --mode ${{ matrix.mode }} \
            --platform ${{ matrix.platform }}

  build-native-linux:
    runs-on: ubuntu-latest
    needs: [codegen]
    permissions:
      contents: read
      packages: write
    container:
      image: unityci/editor:2022.3.42f1-linux-il2cpp-3
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /usr/share/dotnet:/to_clean/dotnet
        - /usr/local/.ghcup:/to_clean/ghcup
        - /usr/share/swift:/to_clean/swift
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync build-cesium --platform linux

  build-native-windows:
    runs-on: windows-latest
    needs: [codegen]
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync build-cesium --platform windows

  build-native-android:
    runs-on: ubuntu-latest
    needs: [codegen]
    permissions:
      contents: read
      packages: write
    container:
      image: unityci/editor:2022.3.42f1-android-3
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /usr/share/dotnet:/to_clean/dotnet
        - /usr/local/.ghcup:/to_clean/ghcup
        - /usr/share/swift:/to_clean/swift
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv

      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync build-cesium --platform android

  combine-and-publish:
    runs-on: ubuntu-latest
    needs:
      - build-native-linux
      - build-native-windows
      - build-native-android
    permissions:
      contents: read
      id-token: write
      packages: write
    container:
      image: unityci/editor:2022.3.42f1-linux-il2cpp-3
      volumes:
        - /usr/local/lib/android:/to_clean/android
        - /usr/share/dotnet:/to_clean/dotnet
        - /usr/local/.ghcup:/to_clean/ghcup
        - /usr/share/swift:/to_clean/swift

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv

      - name: Combine and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run --no-sync combine-cesium
