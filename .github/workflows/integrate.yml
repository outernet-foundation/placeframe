name: Integrate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

concurrency:
  group: integrate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mirror-images:
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/mirror.yml@ccf766ac23b4ce7fbc54a8f6d1659d8a9ae1b135

  preflight:
    needs: [mirror-images]
    permissions:
      contents: read
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/preflight.yml@ccf766ac23b4ce7fbc54a8f6d1659d8a9ae1b135

  compile-check-unity:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/compile-check-unity.yml@ccf766ac23b4ce7fbc54a8f6d1659d8a9ae1b135
    secrets:
      unity-email: ${{ secrets.UNITY_EMAIL }}
      unity-password: ${{ secrets.UNITY_PASSWORD }}
      unity-serial: ${{ secrets.UNITY_SERIAL }}

  build-docker:
    needs: [preflight]
    permissions:
      contents: read
      packages: write
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/build-docker.yml@ccf766ac23b4ce7fbc54a8f6d1659d8a9ae1b135

  release-pr-builds:
    needs: [build-docker, compile-check-unity]
    permissions:
      contents: write
      packages: read
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/release-pr-builds.yml@ccf766ac23b4ce7fbc54a8f6d1659d8a9ae1b135
