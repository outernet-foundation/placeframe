name: Placeframe

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    needs: [mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv
        with:
          save-cache: "true"

      - name: Preflight checks and codegen staleness
        run: uv run --no-sync preflight

  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    name: mirror-images
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: ./.github/actions/setup-uv

      - name: Login to ghcr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Populate image mirror
        run: uvx --from release-devkit==0.1.8 mirror-images --config build/publish-config.json

  build-docker:
    needs: [preflight, mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [common, cuda, rocm]
    name: build-docker (${{ matrix.variant }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: ./.github/actions/setup-uv

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run --no-sync build-docker --variant ${{ matrix.variant }}

  publish-compose:
    needs: [build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [cuda, rocm]
    name: publish-compose (${{ matrix.variant }})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: ./.github/actions/setup-uv

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: uv run --no-sync publish-compose --variant ${{ matrix.variant }}

  ensure-release-pr:
    needs: [build-docker, publish-compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLACEFRAME_CI_APP_ID }}
          private-key: ${{ secrets.PLACEFRAME_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-uv

      - name: Ensure release PR exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uvx --from release-devkit==0.1.8 ensure-release-pr
