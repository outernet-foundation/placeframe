name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: "Override: use this CI run ID instead of looking up by SHA"
        required: false
  workflow_run:
    workflows: [Placeframe]
    types: [completed]
    branches: [dev]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  actions: read

jobs:
  release:
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PLACEFRAME_CI_APP_ID }}
          private-key: ${{ secrets.PLACEFRAME_CI_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      # Workaround: fetch-tags is broken with shallow clones
      - run: git fetch --tags origin

      - uses: ./.github/actions/setup-uv

      - name: Fetch CI artifacts
        id: fetch-ci-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync fetch-ci-artifacts --config build/publish-config.json ${{ inputs.ci-run-id && format('--ci-run-id {0}', inputs.ci-run-id) || '' }}

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run --no-sync publish-packages --config build/publish-config.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: uv run --no-sync create-release --config build/publish-config.json

  publish-dev:
    # The dev channel: every green dev push publishes immutable -dev.<ci-run-id> prereleases.
    # Runs via workflow_run (after the Placeframe CI workflow succeeds on dev) so greenness is proven
    # before anything reaches a registry. Must stay in this workflow file: npm allows one trusted
    # publisher per package, bound to a single workflow filename shared with the stable release job.
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Workaround: fetch-tags is broken with shallow clones
      - run: git fetch --tags origin

      - uses: ./.github/actions/setup-uv

      - name: Publish dev prereleases
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >-
          uv run --no-sync publish-dev
          --config build/publish-config.json
          --run-id ${{ github.event.workflow_run.id }}
