name: Merge gate

on:
  pull_request:
    branches: [dev]
    types: [labeled]

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}

permissions:
  contents: read
  packages: write

jobs:
  merge-gate:
    uses: outernet-foundation/github-actions-toolkit/.github/workflows/merge-gate.yml@ccf766ac23b4ce7fbc54a8f6d1659d8a9ae1b135
    secrets:
      merge-bot-private-key: ${{ secrets.MERGE_BOT_APP_PRIVATE_KEY }}
