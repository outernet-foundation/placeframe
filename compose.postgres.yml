volumes:
  postgres_data:

services:
  postgres:
    image: "ghcr.io/outernet-foundation/placeframe/postgres:${POSTGRES_SHA:?err}"
    ports:
      - "55432:5432"
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    entrypoint: /usr/local/bin/entrypoint-wrapper.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -q -h localhost -p 5432 -U $${POSTGRES_USER} -d postgres" ]
      interval: 1s
      timeout: 1s
      retries: 30
    environment:
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:?err}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?err}"
