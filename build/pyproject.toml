[project]
name = "build-scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "bashrun>=0.1.0",
  "ci-devkit>=0.1.0",
  "docker-devkit>=0.1.0",
  "unity-devkit>=0.1.0",
  "openapi-client-codegen>=0.1.0",
  "python-devkit>=0.1.0",
  "datamodel-code-generator>=0.33.0",
  "psycopg[binary]>=3.2.10",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.9.1",
  "pyhumps>=3.8.0",
  "pyyaml>=6.0",
  "sqlacodegen==3.2.0",
  "sqlalchemy>=2.0.45",
  "typer>=0.17.4",
]

[tool.deptry]
known_first_party = ["build_scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = ["datamodel-code-generator", "psycopg", "openapi-client-codegen"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_scripts"]

[project.scripts]
build-cesium = "build_scripts.cesium.build:app"
build-docker = "build_scripts.placeframe.ci.build_docker:ci_app"
codegen-cesium = "build_scripts.cesium.codegen:app"
combine-cesium = "build_scripts.cesium.combine:app"
generate-clients = "openapi_client_codegen.cli:app"
generate-datamodels = "build_scripts.placeframe.generate_datamodels:main"
  preflight = "build_scripts.placeframe.ci.preflight:app"
  protect-branches = "build_scripts.placeframe.protect_branches:app"
  publish-compose = "build_scripts.placeframe.ci.publish_compose:ci_app"
