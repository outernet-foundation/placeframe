[project]
name = "build-scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "bashrun",
  "stack-lifecycle",
  "unity-buildkit",
  "openapi-clientgen",
  "datamodel-code-generator>=0.33.0",
  "psycopg[binary]>=3.2.10",
  "pydantic>=2.11.7",
  "pydantic-settings>=2.9.1",
  "pyhumps>=3.8.0",
  "sqlacodegen==3.2.0",
  "sqlalchemy>=2.0.45",
  "typer>=0.17.4",
]

[tool.deptry]
known_first_party = ["build_scripts"]

[tool.deptry.per_rule_ignores]
DEP002 = ["datamodel-code-generator", "psycopg"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/build_scripts"]

[project.scripts]
build-cesium = "build_scripts.cesium.build:app"
build-docker = "build_scripts.placeframe.ci.build_docker:ci_app"
codegen-cesium = "build_scripts.cesium.codegen:app"
combine-cesium = "build_scripts.cesium.combine:app"
create-release = "build_scripts.placeframe.ci.create_release:app"
deptry-check = "build_scripts.placeframe.deptry_check:main"
ensure-release-pr = "build_scripts.placeframe.ci.ensure_release_pr:app"
fetch-ci-artifacts = "build_scripts.placeframe.ci.fetch_ci_artifacts:app"
generate-clients = "build_scripts.placeframe.generate_clients:app"
generate-datamodels = "build_scripts.placeframe.generate_datamodels:main"
generate-score = "build_scripts.placeframe.generate_score:app"
lock-python = "build_scripts.placeframe.lock_python:app"
preflight = "build_scripts.placeframe.ci.preflight:app"
protect-branches = "build_scripts.placeframe.protect_branches:app"
publish-compose = "build_scripts.placeframe.ci.publish_compose:ci_app"
publish-packages = "build_scripts.placeframe.ci.publish_packages:app"
