[project]
name = "scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bashrun>=0.1.0",
    "docker-devkit>=0.4.2",
    "openapi-client-codegen>=0.1.12",
    "python-devkit>=0.1.0",
    "placeframe-core",
    "placeframe-api-client",
    "pydantic>=2",
    "pydantic-settings>=2.9.1",
    "httpx>=0.28.1",
    "typer>=0.15",
    "numpy>=2.1",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pytransform3d>=3.5",
    "sqlacodegen==3.2.0",
    "sqlalchemy>=2.0.45",
    "datamodel-code-generator>=0.33.0",
    "psycopg[binary]>=3.2.10",
    "pyhumps>=3.8.0",
]

[tool.deptry.per_rule_ignores]
DEP002 = ["datamodel-code-generator", "psycopg", "openapi-client-codegen", "python-devkit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scripts"]

[project.scripts]
forward-unity-android-debug-port = "scripts.forward_unity_android_debug_port:main"
list-debug-targets = "scripts.list_debug_targets:main"
loki-query = "scripts.loki_query:app"
tune-reconstruction = "scripts.tune_reconstruction:app"
fit-calibration = "scripts.fit_calibration:app"
displacement-check = "scripts.displacement_check:app"
audit-capture-reconstruction = "scripts.audit_capture_reconstruction:app"
sweep-postprocess = "scripts.sweep_postprocess:app"
two-view-diagnostic = "scripts.two_view_diagnostic:app"
reconstruction = "scripts.reconstruction:app"
pf-secrets = "scripts.secrets_exec:app"
generate-clients = "openapi_client_codegen.cli:app"
generate-datamodels = "scripts.generate_datamodels:main"
publish-compose = "scripts.publish_compose:ci_app"
